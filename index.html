<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>룰렛 - 랜덤 선택기</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <h1>룰렛</h1>
    <p class="subtitle">카테고리와 항목을 편집하고 돌려서 무작위로 하나를 선택하세요.</p>

    <div class="category-bar">
      <ul id="category-list" class="category-list"></ul>
    </div>

    <div class="layout">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="360" height="360"></canvas>
      </div>

      <div class="controls">
        <form id="add-form">
          <input id="item-input" type="text" placeholder="항목 입력 후 Enter" maxlength="30" autocomplete="off">
          <button type="submit">추가</button>
        </form>

        <ul id="item-list"></ul>

        <button id="spin-btn" class="primary">돌리기</button>
        <p id="result" aria-live="polite"></p>
      </div>
    </div>
  </main>

  <canvas id="confetti-canvas"></canvas>

  <script src="roulette.js"></script>
  <script src="script.js"></script>
</body>
</html>
