<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>커피 룰렛</title>

<!-- PWA: lets phones "Add to Home Screen" and open this in a standalone,
     app-like window instead of a browser tab. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17070f">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="커피 룰렛">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* Always dark: the pastel wheel/accent colors are kept as-is, only the
   page chrome (background, cards, text) uses a fixed dark palette. */
:root {
  color-scheme: dark;
  --bg: #000000;
  --fg: #f2f2f5;
  --accent: #ff5470;
  --danger: #d1264f;
  --card: #1c1c20;
  --border: #303036;
  --rim: #4a3a44;
  --banner-bg: #17070f;
  --banner-fg: #ffe3ec;
  --banner-border: var(--accent);
  --inset: #131316;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}

/* ---------- Result banner ---------- */
.result-banner {
  position: sticky;
  top: 0;
  z-index: 20;
  padding: 14px 16px;
  background: var(--banner-bg);
  border-bottom: 3px solid var(--banner-border);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
  color: var(--banner-fg);
}

.banner-inner {
  width: min(1100px, 96vw);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

#result {
  width: 100%;
  margin: 0;
  /* Clear space for the fixed corner-action stacks on both sides
     (the right stack's "당첨횟수 초기화" label is the widest button). */
  padding: 0 100px;
  text-align: center;
  font-size: clamp(1rem, 4vw, 2.4rem);
  font-weight: 800;
  line-height: 1.2;
  color: var(--banner-fg);
}

#result.spinning {
  opacity: 0.65;
  font-weight: 600;
}

#result.celebrate {
  color: var(--accent);
  animation: result-pop 0.6s ease;
}

@keyframes result-pop {
  0% {
    transform: scale(0.4);
    opacity: 0;
  }
  60% {
    transform: scale(1.2);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

/* Pinned to the top corners of the viewport, outside the result banner,
   each stacked vertically flush against its edge. */
.corner-actions {
  position: fixed;
  top: 0;
  z-index: 21;
  display: flex;
  flex-direction: column;
}

.corner-actions button {
  padding: 6px 10px;
  font-size: 0.75rem;
  border-radius: 0;
  background: var(--card);
  color: var(--fg);
  border: 1px solid var(--border);
}

.corner-actions button:hover:not(:disabled) {
  filter: brightness(0.97);
}

.corner-actions-left {
  left: 0;
}

.corner-actions-left button {
  border-left: none;
}

.corner-actions-left button:first-child {
  border-top-right-radius: 8px;
}

.corner-actions-left button:last-child {
  border-bottom-right-radius: 8px;
  border-top: none;
}

.corner-actions-right {
  right: 0;
  align-items: flex-end;
}

.corner-actions-right button {
  border-right: none;
}

.corner-actions-right button:first-child {
  border-top-left-radius: 8px;
}

.corner-actions-right button:last-child {
  border-bottom-left-radius: 8px;
  border-top: none;
}

/* ---------- Layout ---------- */
.app {
  width: min(1100px, 96vw);
  margin: 0 auto;
  padding: 24px 16px 48px;
  text-align: center;
}

h1 {
  margin: 0 0 4px;
  font-size: 1.6rem;
}

.subtitle {
  margin: 0 0 20px;
  opacity: 0.7;
}

.editable-heading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.editable-heading .edit-input {
  width: min(420px, 80vw);
  text-align: center;
}

/* ---------- Wheel + play controls ---------- */
.wheel-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}

/* The wrap is the stationary bowl; only the canvas inside spins. */
.wheel-wrap {
  position: relative;
  padding: 15px;
  border-radius: 50%;
  background: var(--rim);
  box-shadow:
    0 10px 24px rgba(0, 0, 0, 0.12),
    inset 0 0 0 3px rgba(0, 0, 0, 0.06);
  max-width: 100%;
}

.pointer {
  position: absolute;
  top: 2px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-top: 24px solid var(--accent);
  filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.25));
  z-index: 3;
}

#wheel {
  display: block;
  max-width: 100%;
  height: auto;
  border-radius: 50%;
  transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
}

.play-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

/* ---------- Category board ---------- */
.category-board {
  display: flex;
  gap: 16px;
  overflow-x: auto;
  padding-bottom: 12px;
  text-align: left;
  justify-content: flex-start;
}

.category-column {
  flex: 0 0 270px;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.category-column.drag-over {
  border-color: var(--accent);
  border-style: dashed;
}

.category-column-header {
  display: flex;
  align-items: center;
  gap: 6px;
}

.category-name {
  font-weight: 700;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.category-items {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 340px;
  overflow-y: auto;
}

.item-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 6px 8px;
  background: var(--inset);
  border: 1px solid var(--border);
  border-radius: 8px;
}

.item-row.drag-over {
  border-color: var(--accent);
  border-style: dashed;
}

.item-main {
  display: flex;
  align-items: center;
  gap: 6px;
}

.item-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.item-stats {
  padding-left: 8px;
  font-size: 0.65rem;
  line-height: 1.3;
  opacity: 0.55;
}

.add-item-form {
  display: flex;
  gap: 6px;
}

.add-item-form input {
  flex: 1;
  min-width: 0;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--inset);
  color: var(--fg);
  /* 16px minimum keeps iOS Safari from zooming in when the field is focused. */
  font-size: 16px;
}

.add-item-form button {
  padding: 6px 10px;
}

.category-column.add-column {
  align-items: center;
  justify-content: center;
  border-style: dashed;
  min-height: 64px;
}

.add-category-btn {
  white-space: nowrap;
}

/* ---------- Shared small controls ---------- */
.drag-handle {
  opacity: 0.4;
  cursor: grab;
  font-size: 0.8rem;
  line-height: 1;
}

/* Touch/keyboard fallback for reordering, since HTML5 drag-and-drop
   (the ⋮⋮ handles) has no touch equivalent on phones. */
.reorder-buttons {
  display: flex;
  gap: 1px;
}

.reorder-btn {
  padding: 1px 4px;
  font-size: 0.65rem;
}

.icon-btn {
  padding: 2px 6px;
  border: none;
  background: transparent;
  font-size: 0.85rem;
  opacity: 0.6;
}

.icon-btn:hover:not(:disabled) {
  opacity: 1;
  color: var(--accent);
}

.editable-heading .icon-btn {
  font-size: 0.8rem;
}

.edit-input {
  padding: 4px 6px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--inset);
  color: var(--fg);
  /* 16px minimum keeps iOS Safari from zooming in when the field is focused. */
  font-size: 16px;
  width: 100%;
}

.item-checkbox {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  cursor: pointer;
}

.item-checkbox:disabled {
  cursor: not-allowed;
}

button {
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  color: var(--fg);
  font-size: 1rem;
  cursor: pointer;
}

button:hover:not(:disabled) {
  filter: brightness(0.95);
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

input:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

button.primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  font-weight: 600;
}

button.danger {
  background: var(--danger);
  color: #fff;
  border-color: var(--danger);
  font-weight: 600;
}

/* ---------- Confirm dialog ---------- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 16px;
}

.modal-overlay[hidden] {
  display: none;
}

.modal-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  width: min(360px, 100%);
  text-align: center;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
}

#confirm-message {
  margin: 0 0 20px;
  font-size: 1.05rem;
  font-weight: 600;
}

.modal-title {
  margin: 0 0 16px;
  font-size: 1.05rem;
  font-weight: 700;
}

.share-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
  margin-bottom: 14px;
}

.share-hint {
  margin: 0 0 16px;
  font-size: 0.75rem;
  line-height: 1.5;
  opacity: 0.6;
}

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.modal-actions button {
  flex: 1;
}

/* ---------- Confetti ---------- */
#confetti-canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 999;
}

/* ---------- Touch targets ----------
   pointer:coarse (touchscreens, not just narrow windows) targets real
   phones/tablets specifically, since the buttons below are sized fine
   for a mouse cursor but too small to reliably tap with a finger. */
@media (pointer: coarse) {
  /* Corner buttons grow below with more padding, so #result needs more
     clearance too or its text runs under "당첨횟수 초기화". */
  #result {
    padding: 0 128px;
  }

  .category-column {
    flex-basis: 300px;
  }

  .icon-btn {
    padding: 8px;
    font-size: 1rem;
    min-width: 36px;
    min-height: 36px;
  }

  .reorder-btn {
    padding: 6px 9px;
    font-size: 0.85rem;
    min-width: 32px;
    min-height: 32px;
  }

  .item-checkbox {
    width: 22px;
    height: 22px;
  }

  .add-item-form button {
    padding: 8px 14px;
    min-height: 36px;
  }

  .corner-actions button {
    padding: 10px 14px;
    font-size: 0.8rem;
  }
}
</style>
</head>
<body>
  <div class="corner-actions corner-actions-left">
    <button id="export-btn" type="button">내보내기</button>
    <button id="import-btn" type="button">가져오기</button>
    <input id="import-file-input" type="file" accept="application/json,.json,text/plain,.txt" hidden>
  </div>

  <div class="corner-actions corner-actions-right">
    <button id="reset-wins-btn" type="button">당첨횟수 초기화</button>
    <button id="restore-wins-btn" type="button">당첨횟수 복구</button>
  </div>

  <div class="result-banner">
    <div class="banner-inner">
      <p id="result" aria-live="polite">룰렛을 돌려보세요</p>
    </div>
  </div>

  <main class="app">
    <h1 id="board-title" class="editable-heading"></h1>
    <p id="board-subtitle" class="subtitle editable-heading"></p>

    <div class="wheel-section">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="360" height="360"></canvas>
      </div>

      <div class="play-controls">
        <button id="spin-btn" class="primary">돌리기</button>
      </div>
    </div>

    <div id="category-board" class="category-board"></div>
  </main>

  <canvas id="confetti-canvas"></canvas>

  <div id="confirm-dialog" class="modal-overlay" hidden>
    <div class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-message">
      <p id="confirm-message">정말 제거하시겠습니까?</p>
      <div class="modal-actions">
        <button id="confirm-cancel-btn" type="button">취소</button>
        <button id="confirm-ok-btn" type="button" class="danger">제거</button>
      </div>
    </div>
  </div>

  <div id="share-dialog" class="modal-overlay" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="share-title">
      <p id="share-title" class="modal-title">내보내기 / 공유</p>
      <div class="share-actions">
        <button id="share-file-btn" type="button">정보 파일 내보내기 (.json)</button>
        <button id="share-instagram-btn" type="button">인스타그램 공유</button>
        <button id="share-discord-btn" type="button">디스코드 공유</button>
      </div>
      <p id="share-hint" class="share-hint"></p>
      <div class="modal-actions">
        <button id="share-close-btn" type="button">닫기</button>
      </div>
    </div>
  </div>

  <script>
    // Winner-picking logic. `random` is injectable so it can be tested
    // deterministically; the app itself always calls it with Math.random.
    const Roulette = (function () {
      function pickWinnerIndex(itemCount, random) {
        if (!Number.isInteger(itemCount) || itemCount <= 0) {
          throw new RangeError("itemCount must be a positive integer");
        }
        const rand = typeof random === "function" ? random : Math.random;
        return Math.floor(rand() * itemCount);
      }
      return { pickWinnerIndex };
    })();
  </script>
  <script>
(function () {
  const STORAGE_KEY = "roulette-state-v1";
  const DAY_MS = 24 * 60 * 60 * 1000;
  const WEEK_MS = 7 * DAY_MS;
  const FOUR_WEEKS_MS = 28 * DAY_MS;
  // The original fixed spin was 1800 degrees over 4 seconds.
  const BASE_DEG_PER_SEC = 450;

  const SLICE_COLORS = ["#ff8fa3", "#ffc38f", "#ffe58f", "#8fe3b0", "#8fd3f4", "#c9a8f5"];
  const CONFETTI_COLORS = ["#ff8fa3", "#ffc38f", "#ffe58f", "#8fe3b0", "#8fd3f4", "#c9a8f5", "#ffffff"];

  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const confettiCanvas = document.getElementById("confetti-canvas");
  const confettiCtx = confettiCanvas.getContext("2d");

  const titleEl = document.getElementById("board-title");
  const subtitleEl = document.getElementById("board-subtitle");
  const categoryBoard = document.getElementById("category-board");
  const spinBtn = document.getElementById("spin-btn");
  const result = document.getElementById("result");
  const resetWinsBtn = document.getElementById("reset-wins-btn");
  const restoreWinsBtn = document.getElementById("restore-wins-btn");
  const exportBtn = document.getElementById("export-btn");
  const importBtn = document.getElementById("import-btn");
  const importFileInput = document.getElementById("import-file-input");

  const confirmDialog = document.getElementById("confirm-dialog");
  const confirmMessage = document.getElementById("confirm-message");
  const confirmOkBtn = document.getElementById("confirm-ok-btn");
  const confirmCancelBtn = document.getElementById("confirm-cancel-btn");

  const shareDialog = document.getElementById("share-dialog");
  const shareHint = document.getElementById("share-hint");
  const shareFileBtn = document.getElementById("share-file-btn");
  const shareInstagramBtn = document.getElementById("share-instagram-btn");
  const shareDiscordBtn = document.getElementById("share-discord-btn");
  const shareCloseBtn = document.getElementById("share-close-btn");

  let nextId = 1;
  function makeId(prefix) {
    return `${prefix}-${nextId++}`;
  }

  function createSeedCategories() {
    return [
      {
        id: makeId("cat"),
        name: "사업팀",
        items: [
          { id: makeId("item"), name: "김사원", included: true, wins: [] },
          { id: makeId("item"), name: "하대리", included: true, wins: [] },
        ],
      },
      {
        id: makeId("cat"),
        name: "홍보팀",
        items: [
          { id: makeId("item"), name: "박팀장", included: true, wins: [] },
          { id: makeId("item"), name: "이주임", included: true, wins: [] },
        ],
      },
    ];
  }

  let categories = [];
  let boardTitle = "커피 룰렛";
  let boardSubtitle = "오늘 행운의 커피 구매자는?";
  let winsBackup = null;

  let editingHeaderField = null;
  let editingCategoryId = null;
  let addingCategory = false;
  let editingItemId = null;

  let rotation = 0;
  let spinning = false;
  let confettiAnimationId = null;

  // ---------- Persistence ----------
  function serializeState() {
    return {
      version: 1,
      title: boardTitle,
      subtitle: boardSubtitle,
      categories,
      winsBackup,
      nextId,
      volume: masterVolume,
      muted,
    };
  }

  // Shared by loadState() (localStorage) and importState() (a file the
  // user picked), so both go through the same validation/normalization.
  function applyStateData(data) {
    if (!data || !Array.isArray(data.categories)) return false;

    categories = data.categories.map((category) => ({
      id: String(category.id),
      name: String(category.name),
      items: Array.isArray(category.items)
        ? category.items.map((item) => ({
            id: String(item.id),
            name: String(item.name),
            included: item.included !== false,
            wins: Array.isArray(item.wins) ? item.wins.filter((t) => typeof t === "number") : [],
          }))
        : [],
    }));

    if (typeof data.title === "string" && data.title.trim()) boardTitle = data.title;
    if (typeof data.subtitle === "string" && data.subtitle.trim()) boardSubtitle = data.subtitle;
    winsBackup = data.winsBackup && typeof data.winsBackup === "object" ? data.winsBackup : null;
    if (typeof data.volume === "number") masterVolume = Math.min(1, Math.max(0, data.volume));
    muted = data.muted === true;
    if (Number.isFinite(data.nextId)) nextId = data.nextId;

    // Guard against id collisions if the stored/imported counter drifted.
    let highest = nextId - 1;
    categories.forEach((category) => {
      [category, ...category.items].forEach((entity) => {
        const match = /-(\d+)$/.exec(entity.id);
        if (match) highest = Math.max(highest, Number(match[1]));
      });
    });
    nextId = highest + 1;

    return true;
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeState()));
    } catch (e) {
      // Storage can be unavailable (private mode, quota); the app still
      // works for the current session without it.
    }
  }

  function loadState() {
    let raw = null;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      return false;
    }
    if (!raw) return false;

    try {
      return applyStateData(JSON.parse(raw));
    } catch (e) {
      return false;
    }
  }

  // ---------- Import ----------
  async function importStateFromFile(file) {
    let data;
    try {
      data = JSON.parse(await file.text());
    } catch (e) {
      window.alert("파일을 읽을 수 없습니다. 올바른 백업 파일인지 확인해주세요.");
      return;
    }
    if (!data || !Array.isArray(data.categories)) {
      window.alert("올바른 백업 파일 형식이 아닙니다.");
      return;
    }

    const ok = await showConfirm(
      "현재 데이터를 가져온 파일 내용으로 덮어씁니다. 계속하시겠습니까?",
      "가져오기",
      true
    );
    if (!ok) return;

    applyStateData(data);
    editingHeaderField = null;
    editingCategoryId = null;
    addingCategory = false;
    editingItemId = null;
    applyVolume();
    renderAll();
  }

  // ---------- Audio ----------
  let audioCtx = null;
  let masterGain = null;
  let masterVolume = 0.6;
  let muted = false;

  function ensureAudioCtx() {
    const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtxClass) return null;
    if (!audioCtx) {
      audioCtx = new AudioCtxClass();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = muted ? 0 : masterVolume;
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function applyVolume() {
    if (masterGain) masterGain.gain.value = muted ? 0 : masterVolume;
  }

  function playClick() {
    const ac = ensureAudioCtx();
    if (!ac) return;
    try {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = "square";
      osc.frequency.value = 700;
      const start = ac.currentTime;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.15, start + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.06);
      osc.connect(gain).connect(masterGain);
      osc.start(start);
      osc.stop(start + 0.07);
    } catch (e) {
      // Ignore playback failures (e.g. autoplay restrictions).
    }
  }

  function scheduleTick(atTime) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = 1000;
      gain.gain.setValueAtTime(0.0001, atTime);
      gain.gain.exponentialRampToValueAtTime(0.14, atTime + 0.003);
      gain.gain.exponentialRampToValueAtTime(0.0001, atTime + 0.03);
      osc.connect(gain).connect(masterGain);
      osc.start(atTime);
      osc.stop(atTime + 0.04);
    } catch (e) {
      // Ignore playback failures.
    }
  }

  // Synthesizes a short ascending fanfare with the Web Audio API so no
  // external audio asset is needed; playback failures are non-fatal.
  function playFanfare() {
    if (!audioCtx) return;
    try {
      const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.value = freq;
        const start = audioCtx.currentTime + i * 0.12;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.2, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.3);
        osc.connect(gain).connect(masterGain);
        osc.start(start);
        osc.stop(start + 0.35);
      });
    } catch (e) {
      // Ignore playback failures (e.g. autoplay restrictions).
    }
  }

  // Evaluates a CSS-style cubic-bezier(p1x,p1y,p2x,p2y) easing at time
  // fraction t, via binary search over the bezier's parametric variable.
  function makeCubicBezierEasing(p1x, p1y, p2x, p2y) {
    function sampleX(u) {
      const mu = 1 - u;
      return 3 * mu * mu * u * p1x + 3 * mu * u * u * p2x + u * u * u;
    }
    function sampleY(u) {
      const mu = 1 - u;
      return 3 * mu * mu * u * p1y + 3 * mu * u * u * p2y + u * u * u;
    }
    return function progressAt(t) {
      let lower = 0;
      let upper = 1;
      let u = t;
      for (let i = 0; i < 20; i++) {
        const x = sampleX(u);
        if (Math.abs(x - t) < 1e-4) break;
        if (x < t) lower = u;
        else upper = u;
        u = (lower + upper) / 2;
      }
      return sampleY(u);
    };
  }

  const wheelEasing = makeCubicBezierEasing(0.17, 0.67, 0.12, 0.99);

  function findTimeFractionForProgress(targetProgress) {
    let lower = 0;
    let upper = 1;
    let t = targetProgress;
    for (let i = 0; i < 20; i++) {
      const p = wheelEasing(t);
      if (Math.abs(p - targetProgress) < 1e-4) break;
      if (p < targetProgress) lower = t;
      else upper = t;
      t = (lower + upper) / 2;
    }
    return t;
  }

  // Schedules a click for every slice boundary that passes the fixed
  // pointer while the wheel rotates from startRotation to endRotation,
  // timed to match the CSS transition's easing so the "roulette ticking"
  // sound speeds up and slows down together with the visual spin.
  function scheduleSpinTicks(startRotation, endRotation, sliceAngle, durationMs) {
    if (!audioCtx) return;
    const pointerAngle = 270;
    const totalDelta = endRotation - startRotation;
    if (totalDelta <= 0) return;

    const phase = ((pointerAngle % sliceAngle) + sliceAngle) % sliceAngle;
    let firstBoundary = startRotation + ((((phase - startRotation) % sliceAngle) + sliceAngle) % sliceAngle);
    if (firstBoundary <= startRotation) firstBoundary += sliceAngle;

    const baseTime = audioCtx.currentTime;
    for (let r = firstBoundary; r <= endRotation; r += sliceAngle) {
      const progress = (r - startRotation) / totalDelta;
      const timeFraction = findTimeFractionForProgress(progress);
      scheduleTick(baseTime + (timeFraction * durationMs) / 1000);
    }
  }

  // ---------- Confirm dialog ----------
  function showConfirm(message, confirmLabel, danger) {
    return new Promise((resolve) => {
      confirmMessage.textContent = message;
      confirmOkBtn.textContent = confirmLabel || "제거";
      confirmOkBtn.className = danger === false ? "primary" : "danger";
      confirmDialog.hidden = false;

      function onKeydown(e) {
        if (e.key === "Escape") cleanup(false);
      }
      function onOverlayClick(e) {
        if (e.target === confirmDialog) cleanup(false);
      }
      function cleanup(value) {
        confirmDialog.hidden = true;
        confirmOkBtn.removeEventListener("click", onOk);
        confirmCancelBtn.removeEventListener("click", onCancel);
        confirmDialog.removeEventListener("click", onOverlayClick);
        document.removeEventListener("keydown", onKeydown);
        resolve(value);
      }
      function onOk() {
        playClick();
        cleanup(true);
      }
      function onCancel() {
        playClick();
        cleanup(false);
      }

      confirmOkBtn.addEventListener("click", onOk);
      confirmCancelBtn.addEventListener("click", onCancel);
      confirmDialog.addEventListener("click", onOverlayClick);
      document.addEventListener("keydown", onKeydown);
      requestAnimationFrame(() => confirmCancelBtn.focus());
    });
  }

  // ---------- Derived data ----------
  // The wheel spins over items marked "included", regardless of which
  // category they belong to, so a single roulette can mix e.g. 사업팀's
  // 김사원 with 홍보팀's 박팀장. Each entry keeps a reference to the real
  // item object (not a copy) so callers can mutate it.
  function getWheelEntries() {
    const entries = [];
    categories.forEach((category) => {
      category.items.forEach((item) => {
        if (item.included) entries.push({ item, categoryName: category.name });
      });
    });
    return entries;
  }

  function reorder(array, fromIndex, toIndex) {
    const [moved] = array.splice(fromIndex, 1);
    array.splice(toIndex, 0, moved);
  }

  // Native HTML5 drag-and-drop (used for the ⋮⋮ handles) has no touch
  // equivalent on phones, so these buttons give touch and keyboard users
  // a working way to reorder categories/items too.
  function createReorderButtons(array, index, symbols, ariaLabelPrefix, onReordered) {
    const wrap = document.createElement("span");
    wrap.className = "reorder-buttons";

    const prevBtn = document.createElement("button");
    prevBtn.type = "button";
    prevBtn.className = "icon-btn reorder-btn";
    prevBtn.textContent = symbols[0];
    prevBtn.disabled = spinning || index === 0;
    prevBtn.setAttribute("aria-label", `${ariaLabelPrefix} 앞으로 이동`);
    prevBtn.addEventListener("click", () => {
      playClick();
      reorder(array, index, index - 1);
      onReordered();
    });
    wrap.appendChild(prevBtn);

    const nextBtn = document.createElement("button");
    nextBtn.type = "button";
    nextBtn.className = "icon-btn reorder-btn";
    nextBtn.textContent = symbols[1];
    nextBtn.disabled = spinning || index === array.length - 1;
    nextBtn.setAttribute("aria-label", `${ariaLabelPrefix} 뒤로 이동`);
    nextBtn.addEventListener("click", () => {
      playClick();
      reorder(array, index, index + 1);
      onReordered();
    });
    wrap.appendChild(nextBtn);

    return wrap;
  }

  // Counts are relative to "now", so they shrink on their own as wins age
  // past the 7-day / 28-day marks.
  function formatWinStats(item) {
    const now = Date.now();
    const week = item.wins.filter((t) => now - t <= WEEK_MS).length;
    const fourWeeks = item.wins.filter((t) => now - t <= FOUR_WEEKS_MS).length;
    return `최근 일주일/한달 내 당첨 횟수 : ${week}회/${fourWeeks}회`;
  }

  function updateSpinAvailability() {
    spinBtn.disabled = getWheelEntries().length < 2 || spinning;
  }

  function renderAll() {
    renderHeader();
    renderCategoryBoard();
    updateSpinAvailability();
    renderTopActions();
    drawWheel();
    saveState();
  }

  // ---------- Editable heading ----------
  function renderEditableHeading(container, value, field, maxLength, apply) {
    container.innerHTML = "";

    if (editingHeaderField === field) {
      const input = document.createElement("input");
      input.type = "text";
      input.className = "edit-input";
      input.value = value;
      input.maxLength = maxLength;
      container.appendChild(input);

      // An inline editor commits on both Enter and blur, and committing
      // re-renders (which removes the focused input and fires blur again),
      // so every commit path is guarded against running twice.
      let done = false;
      const commit = () => {
        if (done) return;
        done = true;
        const next = input.value.trim();
        if (next) apply(next);
        editingHeaderField = null;
        renderAll();
      };
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") commit();
        if (e.key === "Escape") {
          done = true;
          editingHeaderField = null;
          renderHeader();
        }
      });
      input.addEventListener("blur", commit);
      requestAnimationFrame(() => {
        input.focus();
        input.select();
      });
      return;
    }

    const span = document.createElement("span");
    span.textContent = value;
    container.appendChild(span);

    const editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.className = "icon-btn";
    editBtn.textContent = "✎";
    editBtn.disabled = spinning;
    editBtn.setAttribute("aria-label", `${field === "title" ? "제목" : "부제목"} 수정`);
    editBtn.addEventListener("click", () => {
      playClick();
      editingHeaderField = field;
      renderHeader();
    });
    container.appendChild(editBtn);
  }

  function renderHeader() {
    renderEditableHeading(titleEl, boardTitle, "title", 30, (value) => {
      boardTitle = value;
    });
    renderEditableHeading(subtitleEl, boardSubtitle, "subtitle", 80, (value) => {
      boardSubtitle = value;

  function renderTopActions() {

  // ---------- Wheel drawing ----------
  // Sizes are written for a 360px wheel and scaled by `s`.
  function paintHub(g, center, radius, s) {
    g.beginPath();
    g.arc(center, center, radius, 0, Math.PI * 2);
    g.fillStyle = "#fffaf3";
    g.fill();
    g.lineWidth = 2 * s;
    g.strokeStyle = "rgba(0, 0, 0, 0.12)";
    g.stroke();

    g.beginPath();
    g.arc(center, center, radius * 0.45, 0, Math.PI * 2);
    g.fillStyle = "#c9a8f5";
    g.fill();
  }

  function paintWheel(g, size, entries) {
    const s = size / 360;
    const center = size / 2;
    const faceRadius = center - 6 * s;
    const hubRadius = Math.max(24 * s, faceRadius * 0.17);

    g.clearRect(0, 0, size, size);

    // White backing ring so pastel slice edges stay crisp against the rim.
    g.beginPath();
    g.arc(center, center, center - 1 * s, 0, Math.PI * 2);
    g.fillStyle = "#ffffff";
    g.fill();

    if (entries.length === 0) {
      g.beginPath();
      g.arc(center, center, faceRadius, 0, Math.PI * 2);
      g.fillStyle = "#eae7f2";
      g.fill();
      paintHub(g, center, hubRadius, s);
      return;
    }

    const sliceAngle = (Math.PI * 2) / entries.length;
    const fontSize = Math.max(10, Math.min(16, Math.round(140 / entries.length) + 9)) * s;

    entries.forEach((entry, i) => {
      const start = i * sliceAngle;
      const end = start + sliceAngle;

      g.beginPath();
      g.moveTo(center, center);
      g.arc(center, center, faceRadius, start, end);
      g.closePath();
      g.fillStyle = SLICE_COLORS[i % SLICE_COLORS.length];
      g.fill();

      g.beginPath();
      g.moveTo(center, center);
      g.lineTo(center + Math.cos(start) * faceRadius, center + Math.sin(start) * faceRadius);
      g.strokeStyle = "#ffffff";
      g.lineWidth = 2 * s;
      g.stroke();

      g.save();
      g.translate(center, center);
      g.rotate(start + sliceAngle / 2);
      g.textAlign = "right";
      g.textBaseline = "middle";
      g.font = `bold ${fontSize}px system-ui, sans-serif`;
      g.lineWidth = 3 * s;
      g.strokeStyle = "rgba(255, 255, 255, 0.9)";
      g.strokeText(entry.item.name, faceRadius - 18 * s, 0);
      g.fillStyle = "#3a2f45";
      g.fillText(entry.item.name, faceRadius - 18 * s, 0);
      g.restore();
    });

    // Frets between pockets.
    entries.forEach((_, i) => {
      const angle = i * sliceAngle;
      const px = center + Math.cos(angle) * (faceRadius - 3 * s);
      const py = center + Math.sin(angle) * (faceRadius - 3 * s);
      g.beginPath();
      g.arc(px, py, 3.5 * s, 0, Math.PI * 2);
      g.fillStyle = "#ffffff";
      g.lineWidth = 1 * s;
      g.strokeStyle = "rgba(0, 0, 0, 0.15)";
      g.fill();
      g.stroke();
    });

    // Inner ring around the hub.
    g.beginPath();
    g.arc(center, center, hubRadius + 6 * s, 0, Math.PI * 2);
    g.strokeStyle = "rgba(255, 84, 112, 0.8)";
    g.lineWidth = 3 * s;
    g.stroke();

    paintHub(g, center, hubRadius, s);
  }

  function drawWheel() {
    paintWheel(ctx, canvas.width, getWheelEntries());
  }

  // ---------- Category board ----------
  function renderCategoryBoard() {
    const scrollLeft = categoryBoard.scrollLeft;
    categoryBoard.innerHTML = "";

    categories.forEach((category, categoryIndex) => {
      const column = document.createElement("div");
      column.className = "category-column";
      column.draggable = !spinning && editingCategoryId !== category.id;

      const header = document.createElement("div");
      header.className = "category-column-header";

      const handle = document.createElement("span");
      handle.className = "drag-handle";
      handle.textContent = "⋮⋮";
      handle.setAttribute("aria-hidden", "true");
      header.appendChild(handle);
      header.appendChild(
        createReorderButtons(categories, categoryIndex, ["◀", "▶"], category.name, renderAll)
      );

      if (editingCategoryId === category.id) {
        const editInput = document.createElement("input");
        editInput.type = "text";
        editInput.className = "edit-input";
        editInput.value = category.name;
        editInput.maxLength = 20;

        let done = false;
        const commit = () => {
          if (done) return;
          done = true;
          const value = editInput.value.trim();
          if (value) category.name = value;
          editingCategoryId = null;
          renderAll();
        };
        editInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") commit();
          if (e.key === "Escape") {
            done = true;
            editingCategoryId = null;
            renderCategoryBoard();
          }
        });
        editInput.addEventListener("blur", commit);
        requestAnimationFrame(() => {
          editInput.focus();
          editInput.select();
        });
      } else {
        const nameSpan = document.createElement("span");
        nameSpan.className = "category-name";
        nameSpan.textContent = category.name;
        nameSpan.title = category.name;
        header.appendChild(nameSpan);

        const editBtn = document.createElement("button");
        editBtn.type = "button";
        editBtn.className = "icon-btn";
        editBtn.textContent = "✎";
        editBtn.disabled = spinning;
        editBtn.setAttribute("aria-label", `${category.name} 이름 수정`);
        editBtn.addEventListener("click", () => {
          playClick();
          editingCategoryId = category.id;
          renderCategoryBoard();
        });
        header.appendChild(editBtn);
      }

      const removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "icon-btn";
      removeBtn.textContent = "✕";
      removeBtn.disabled = spinning;
      removeBtn.setAttribute("aria-label", `${category.name} 삭제`);
      removeBtn.addEventListener("click", async () => {
        playClick();
        const ok = await showConfirm(
          `"${category.name}" 카테고리와 그 안의 모든 항목을 정말 제거하시겠습니까?`
        );
        if (!ok) return;
        const idx = categories.indexOf(category);
        if (idx !== -1) categories.splice(idx, 1);
        renderAll();
      });
      header.appendChild(removeBtn);

      column.appendChild(header);

      const itemsList = document.createElement("ul");
      itemsList.className = "category-items";

      category.items.forEach((item, itemIndex) => {
        const li = document.createElement("li");
        li.className = "item-row";
        li.draggable = !spinning && editingItemId !== item.id;

        const main = document.createElement("div");
        main.className = "item-main";

        const itemHandle = document.createElement("span");
        itemHandle.className = "drag-handle";
        itemHandle.textContent = "⋮⋮";
        itemHandle.setAttribute("aria-hidden", "true");
        main.appendChild(itemHandle);
        main.appendChild(createReorderButtons(category.items, itemIndex, ["▲", "▼"], item.name, renderAll));

        const checkbox = document.createElement("input");
        checkbox.type = "checkbox";
        checkbox.className = "item-checkbox";
        checkbox.checked = item.included;
        checkbox.disabled = spinning;
        checkbox.setAttribute("aria-label", `${item.name} 룰렛에 포함`);
        checkbox.addEventListener("change", () => {
          playClick();
          item.included = checkbox.checked;
          updateSpinAvailability();
          drawWheel();
          saveState();
        });
        main.appendChild(checkbox);

        if (editingItemId === item.id) {
          const editInput = document.createElement("input");
          editInput.type = "text";
          editInput.className = "edit-input";
          editInput.value = item.name;
          editInput.maxLength = 30;
          main.appendChild(editInput);

          let done = false;
          const commit = () => {
            if (done) return;
            done = true;
            const value = editInput.value.trim();
            if (value) item.name = value;
            editingItemId = null;
            renderAll();
          };
          editInput.addEventListener("keydown", (e) => {
            if (e.key === "Enter") commit();
            if (e.key === "Escape") {
              done = true;
              editingItemId = null;
              renderCategoryBoard();
            }
          });
          editInput.addEventListener("blur", commit);
          requestAnimationFrame(() => {
            editInput.focus();
            editInput.select();
          });
        } else {
          const span = document.createElement("span");
          span.className = "item-name";
          span.textContent = item.name;
          span.title = item.name;
          main.appendChild(span);

          const editBtn = document.createElement("button");
          editBtn.type = "button";
          editBtn.className = "icon-btn";
          editBtn.textContent = "✎";
          editBtn.disabled = spinning;
          editBtn.setAttribute("aria-label", `${item.name} 이름 수정`);
          editBtn.addEventListener("click", () => {
            playClick();
            editingItemId = item.id;
            renderCategoryBoard();
          });
          main.appendChild(editBtn);
        }

        const removeItemBtn = document.createElement("button");
        removeItemBtn.type = "button";
        removeItemBtn.className = "icon-btn";
        removeItemBtn.textContent = "✕";
        removeItemBtn.disabled = spinning;
        removeItemBtn.setAttribute("aria-label", `${item.name} 삭제`);
        removeItemBtn.addEventListener("click", async () => {
          playClick();
          const ok = await showConfirm(`"${item.name}" 항목을 정말 제거하시겠습니까?`);
          if (!ok) return;
          const idx = category.items.indexOf(item);
          if (idx !== -1) category.items.splice(idx, 1);
          renderAll();
        });
        main.appendChild(removeItemBtn);

        li.appendChild(main);

        const stats = document.createElement("div");
        stats.className = "item-stats";
        stats.textContent = formatWinStats(item);
        li.appendChild(stats);

        li.addEventListener("dragstart", (e) => {
          e.stopPropagation();
          e.dataTransfer.setData("text/plain", String(itemIndex));
          e.dataTransfer.effectAllowed = "move";
        });
        li.addEventListener("dragover", (e) => {
          if (spinning) return;
          e.preventDefault();
          e.stopPropagation();
          li.classList.add("drag-over");
        });
        li.addEventListener("dragleave", () => li.classList.remove("drag-over"));
        li.addEventListener("drop", (e) => {
          e.preventDefault();
          e.stopPropagation();
          li.classList.remove("drag-over");
          if (spinning) return;
          const fromIndex = Number(e.dataTransfer.getData("text/plain"));
          if (Number.isNaN(fromIndex) || fromIndex === itemIndex) return;
          reorder(category.items, fromIndex, itemIndex);
          renderAll();
        });

        itemsList.appendChild(li);
      });

      column.appendChild(itemsList);

      const addItemForm = document.createElement("form");
      addItemForm.className = "add-item-form";

      const addItemInput = document.createElement("input");
      addItemInput.type = "text";
      addItemInput.placeholder = "항목 추가";
      addItemInput.maxLength = 30;
      addItemInput.disabled = spinning;
      addItemForm.appendChild(addItemInput);

      const addItemBtn = document.createElement("button");
      addItemBtn.type = "submit";
      addItemBtn.textContent = "+";
      addItemBtn.disabled = spinning;
      addItemForm.appendChild(addItemBtn);

      addItemForm.addEventListener("submit", (e) => {
        e.preventDefault();
        const value = addItemInput.value.trim();
        if (!value) return;
        playClick();
        category.items.push({ id: makeId("item"), name: value, included: true, wins: [] });
        addItemInput.value = "";
        renderAll();
      });

      column.appendChild(addItemForm);

      column.addEventListener("dragstart", (e) => {
        e.dataTransfer.setData("application/x-category-index", String(categoryIndex));
        e.dataTransfer.effectAllowed = "move";
      });
      column.addEventListener("dragover", (e) => {
        if (spinning) return;
        if (!e.dataTransfer.types.includes("application/x-category-index")) return;
        e.preventDefault();
        column.classList.add("drag-over");
      });
      column.addEventListener("dragleave", () => column.classList.remove("drag-over"));
      column.addEventListener("drop", (e) => {
        column.classList.remove("drag-over");
        if (spinning) return;
        const raw = e.dataTransfer.getData("application/x-category-index");
        if (raw === "") return;
        e.preventDefault();
        const fromIndex = Number(raw);
        if (Number.isNaN(fromIndex) || fromIndex === categoryIndex) return;
        reorder(categories, fromIndex, categoryIndex);
        renderAll();
      });

      categoryBoard.appendChild(column);
    });

    const addColumn = document.createElement("div");
    addColumn.className = "category-column add-column";

    if (addingCategory) {
      const addInput = document.createElement("input");
      addInput.type = "text";
      addInput.className = "edit-input";
      addInput.placeholder = "카테고리 이름";
      addInput.maxLength = 20;
      addColumn.appendChild(addInput);

      let done = false;
      const commitAdd = () => {
        if (done) return;
        done = true;
        const value = addInput.value.trim();
        if (value) {
          playClick();
          categories.push({ id: makeId("cat"), name: value, items: [] });
        }
        addingCategory = false;
        renderAll();
      };
      addInput.addEventListener("keydown", (e) => {
        if (e.key === "Enter") commitAdd();
        if (e.key === "Escape") {
          done = true;
          addingCategory = false;
          renderCategoryBoard();
        }
      });
      addInput.addEventListener("blur", commitAdd);
      requestAnimationFrame(() => addInput.focus());
    } else {
      const addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "add-category-btn";
      addBtn.textContent = "+ 카테고리 추가";
      addBtn.disabled = spinning;
      addBtn.addEventListener("click", () => {
        playClick();
        addingCategory = true;
        renderCategoryBoard();
      });
      addColumn.appendChild(addBtn);
    }

    categoryBoard.appendChild(addColumn);
    categoryBoard.scrollLeft = scrollLeft;
  }

  // ---------- Export / share (info file) ----------
  // Local date, not toISOString(): in KST that would stamp yesterday's date
  // on files exported before 9am.
  function todayStamp() {
    const d = new Date();
    const pad = (n) => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function backupJson() {
    return JSON.stringify(serializeState(), null, 2);
  }

  function backupFileName(extension) {
    return `roulette-backup-${todayStamp()}.${extension}`;
  }

  function downloadBackup() {
    const url = URL.createObjectURL(new Blob([backupJson()], { type: "application/json" }));
    const link = document.createElement("a");
    link.href = url;
    link.download = backupFileName("json");
    document.body.appendChild(link);
    link.click();
    link.remove();
    URL.revokeObjectURL(url);
  }

  // Chrome's Web Share only accepts an allowlist of file types and .json
  // isn't on it, so fall back to the same JSON content as a .txt file —
  // 가져오기 reads either. Returns null when files can't be shared at all.
  function shareableBackupFile() {
    if (!navigator.share || !navigator.canShare) return null;
    const json = backupJson();
    const candidates = [
      new File([json], backupFileName("json"), { type: "application/json" }),
      new File([json], backupFileName("txt"), { type: "text/plain" }),
    ];
    return candidates.find((file) => navigator.canShare({ files: [file] })) || null;
  }

  async function shareBackup(target) {
    playClick();
    // Built synchronously so navigator.share still runs inside the tap —
    // Safari rejects the share if anything is awaited first.
    const file = shareableBackupFile();

    if (file) {
      try {
        await navigator.share({ files: [file], title: `${boardTitle} 정보 파일` });
        closeShareDialog();
        return;
      } catch (e) {
        // A cancelled share sheet is not an error worth reporting.
        if (e && e.name === "AbortError") return;
      }
    }

    // No file sharing here (most desktop browsers): save the file so it
    // can be attached by hand.
    downloadBackup();
    closeShareDialog();
    window.alert(
      target === "instagram"
        ? "이 브라우저는 앱으로 바로 공유하는 기능을 지원하지 않아 정보 파일을 저장했습니다.\n인스타그램은 파일 첨부를 지원하지 않으니, 저장된 파일은 디스코드·메일·메신저 등으로 전달해주세요."
        : "이 브라우저는 앱으로 바로 공유하는 기능을 지원하지 않아 정보 파일을 저장했습니다.\n디스코드 채팅창에 저장된 파일을 첨부해 보내주세요."
    );
  }

  function openShareDialog() {
    playClick();
    shareHint.textContent = navigator.share
      ? "휴대폰에서는 공유 시트가 열려 정보 파일을 보낼 앱을 고를 수 있습니다. 인스타그램은 파일 첨부를 받지 않아 목록에 나오지 않을 수 있습니다."
      : "이 브라우저는 앱 공유를 지원하지 않아 정보 파일을 저장한 뒤 직접 첨부하도록 안내합니다.";
    shareDialog.hidden = false;
    requestAnimationFrame(() => shareCloseBtn.focus());
  }

  function closeShareDialog() {
    shareDialog.hidden = true;
  }

  // ---------- Export / import wiring ----------
  exportBtn.addEventListener("click", openShareDialog);

  shareFileBtn.addEventListener("click", () => {
    playClick();
    downloadBackup();
    closeShareDialog();
  });

  shareInstagramBtn.addEventListener("click", () => shareBackup("instagram"));
  shareDiscordBtn.addEventListener("click", () => shareBackup("discord"));

  shareCloseBtn.addEventListener("click", () => {
    playClick();
    closeShareDialog();
  });

  shareDialog.addEventListener("click", (e) => {
    if (e.target === shareDialog) closeShareDialog();
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape" && !shareDialog.hidden) closeShareDialog();
  });

  importBtn.addEventListener("click", () => {
    playClick();
    importFileInput.click();
  });

  importFileInput.addEventListener("change", () => {
    const file = importFileInput.files[0];
    importFileInput.value = "";
    if (file) importStateFromFile(file);
  });

  // ---------- Win history ----------
  resetWinsBtn.addEventListener("click", async () => {
    playClick();
    const ok = await showConfirm("정말 초기화 하시겠습니까?", "초기화", true);
    if (!ok) return;
    const backup = {};
    categories.forEach((category) => {
      category.items.forEach((item) => {
        backup[item.id] = item.wins.slice();
      });
    });
    winsBackup = backup;
    categories.forEach((category) => {
      category.items.forEach((item) => {
        item.wins = [];
      });
    });
    renderAll();
  });

  restoreWinsBtn.addEventListener("click", async () => {
    if (!winsBackup) return;
    playClick();
    const ok = await showConfirm("정말 복구하시겠습니까?", "복구", false);
    if (!ok) return;
    categories.forEach((category) => {
      category.items.forEach((item) => {
        if (Array.isArray(winsBackup[item.id])) item.wins = winsBackup[item.id].slice();
      });
    });
    winsBackup = null;
    renderAll();
  });

  // ---------- Confetti ----------
  function resizeConfettiCanvas() {
    confettiCanvas.width = window.innerWidth;
    confettiCanvas.height = window.innerHeight;
  }
  window.addEventListener("resize", resizeConfettiCanvas);
  resizeConfettiCanvas();

  function launchConfetti() {
    const originX = window.innerWidth / 2;
    const originY = window.innerHeight / 2;
    const particles = Array.from({ length: 140 }, () => ({
      x: originX,
      y: originY,
      vx: (Math.random() - 0.5) * 14,
      vy: (Math.random() - 1.6) * 14,
      size: 4 + Math.random() * 5,
      color: CONFETTI_COLORS[Math.floor(Math.random() * CONFETTI_COLORS.length)],
      rotation: Math.random() * Math.PI * 2,
      rotationSpeed: (Math.random() - 0.5) * 0.3,
    }));

    const duration = 2200;
    const startTime = performance.now();

    if (confettiAnimationId) cancelAnimationFrame(confettiAnimationId);

    function frame(now) {
      const elapsed = now - startTime;
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);

      particles.forEach((p) => {
        p.vy += 0.25;
        p.x += p.vx;
        p.y += p.vy;
        p.rotation += p.rotationSpeed;

        confettiCtx.save();
        confettiCtx.translate(p.x, p.y);
        confettiCtx.rotate(p.rotation);
        confettiCtx.fillStyle = p.color;
        confettiCtx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size * 0.6);
        confettiCtx.restore();
      });

      if (elapsed < duration) {
        confettiAnimationId = requestAnimationFrame(frame);
      } else {
        confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
        confettiAnimationId = null;
      }
    }

    confettiAnimationId = requestAnimationFrame(frame);
  }

  // ---------- Spin ----------
  spinBtn.addEventListener("click", () => {
    const entries = getWheelEntries();
    if (spinning || entries.length < 2) return;
    spinning = true;
    result.textContent = "돌리는 중...";
    result.classList.remove("celebrate");
    result.classList.add("spinning");
    renderAll();

    ensureAudioCtx();
    playClick();

    // Each spin gets its own duration (4-6s) and speed (0.8-1.2x of the
    // original 450°/s), so no two spins feel identical.
    const durationMs = (4 + Math.random() * 2) * 1000;
    const speedFactor = 0.8 + Math.random() * 0.4;
    const targetDegrees = BASE_DEG_PER_SEC * speedFactor * (durationMs / 1000);
    const extraSpins = Math.max(1, Math.round(targetDegrees / 360)) * 360;

    const winnerIndex = Roulette.pickWinnerIndex(entries.length);
    const sliceAngle = 360 / entries.length;
    const targetSliceCenter = winnerIndex * sliceAngle + sliceAngle / 2;
    // Slices are drawn starting from canvas angle 0 (east) going clockwise,
    // but the pointer is fixed at the top of the wheel, which is canvas
    // angle 270 (north). Rotate so the winning slice's center lands there.
    const pointerAngle = 270;
    const currentOffset = rotation % 360;
    const neededOffset = (((pointerAngle - targetSliceCenter) % 360) + 360) % 360;
    const startRotation = rotation;
    const finalRotation = rotation - currentOffset + extraSpins + neededOffset;

    rotation = finalRotation;
    canvas.style.transitionDuration = `${durationMs / 1000}s`;
    canvas.style.transform = `rotate(${rotation}deg)`;

    scheduleSpinTicks(startRotation, finalRotation, sliceAngle, durationMs);

    canvas.addEventListener(
      "transitionend",
      () => {
        spinning = false;
        const winner = entries[winnerIndex];
        const now = Date.now();
        // Wins older than the widest window can never be displayed again,
        // so drop them instead of growing the stored history forever.
        winner.item.wins = winner.item.wins.filter((t) => now - t <= FOUR_WEEKS_MS);
        winner.item.wins.push(now);

        result.textContent = `결과: ${winner.categoryName} ${winner.item.name}`;
        result.classList.remove("spinning");
        result.classList.add("celebrate");
        renderAll();
        launchConfetti();
        playFanfare();
      },
      { once: true }
    );
  });

  // ---------- Keeping the win counts current ----------
  // The 7-day / 28-day counts are computed against "now" at render time,
  // so a long-open page would otherwise keep showing yesterday's numbers.
  function refreshWinStatsIfIdle() {
    const busy =
      spinning ||
      addingCategory ||
      editingHeaderField !== null ||
      editingCategoryId !== null ||
      editingItemId !== null;
    if (busy) return;
    renderCategoryBoard();
  }

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden) refreshWinStatsIfIdle();
  });
  setInterval(refreshWinStatsIfIdle, 10 * 60 * 1000);

  // ---------- Init ----------
  if (!loadState()) categories = createSeedCategories();
  applyVolume();
  renderAll();
})();
  </script>

  <script>
    // Optional: enables offline use and the "Add to Home Screen" install
    // prompt when this page is served over http(s). Silently does nothing
    // when opened as a local file (service workers require http/https).
    if ("serviceWorker" in navigator && (location.protocol === "http:" || location.protocol === "https:")) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js").catch(() => {});
      });
    }
  </script>
