<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>커피 룰렛</title>

<!-- PWA: lets phones "Add to Home Screen" and open this in a standalone,
     app-like window instead of a browser tab. -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#17070f">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="커피 룰렛">
<meta name="mobile-web-app-capable" content="yes">

<style>
/* Always dark: the pastel wheel/accent colors are kept as-is, only the
   page chrome (background, cards, text) uses a fixed dark palette. */
:root {
  color-scheme: dark;
  --bg: #000000;
  --fg: #f2f2f5;
  --accent: #ff5470;
  --danger: #d1264f;
  --card: #1c1c20;
  --border: #303036;
  --rim: #4a3a44;
  --banner-bg: #17070f;
  --banner-fg: #ffe3ec;
  --banner-border: var(--accent);
  --inset: #131316;
  /* Non-zero only on notched phones (and in the installed iOS app, whose
     status bar overlays the page). */
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-right: env(safe-area-inset-right, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --safe-left: env(safe-area-inset-left, 0px);
  /* Measured from the corner buttons at runtime (see fitLayout()). */
  --corner-clear: 100px;
  --corner-height: 0px;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  background: var(--bg);
  color: var(--fg);
  font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
}

/* ---------- Result banner ---------- */
.result-banner {
  position: sticky;
  top: 0;
  z-index: 20;
  box-sizing: border-box;
  display: flex;
  align-items: center;
  min-height: calc(var(--corner-height) + var(--safe-top));
  padding: calc(14px + var(--safe-top)) calc(16px + var(--safe-right)) 14px calc(16px + var(--safe-left));
  background: var(--banner-bg);
  border-bottom: 3px solid var(--banner-border);
  box-shadow: 0 4px 14px rgba(0, 0, 0, 0.1);
  color: var(--banner-fg);
}

.banner-inner {
  width: min(1100px, 96vw);
  margin: 0 auto;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 10px;
}

#result {
  width: 100%;
  margin: 0;
  /* Clear the fixed corner stacks on both sides (equal on both, so the
     text stays centred). Measured, since button widths vary by device. */
  padding: 0 var(--corner-clear);
  /* Break Korean at spaces ("사업팀 / 김사원"), not mid-word ("사업 / 팀");
     a single name too long for the line may still break. */
  word-break: keep-all;
  overflow-wrap: anywhere;
  text-align: center;
  font-size: clamp(1rem, 4vw, 2.4rem);
  font-weight: 800;
  line-height: 1.2;
  color: var(--banner-fg);
}

#result.spinning {
  opacity: 0.65;
  font-weight: 600;
}

#result.celebrate {
  color: var(--accent);
  animation: result-pop 0.6s ease;
}

@keyframes result-pop {
  0% {
    transform: scale(0.4);
    opacity: 0;
  }
  60% {
    transform: scale(1.2);
    opacity: 1;
  }
  100% {
    transform: scale(1);
    opacity: 1;
  }
}

/* Pinned to the top corners of the viewport, outside the result banner,
   each stacked vertically flush against its edge. The frame and rounding
   live on the stack rather than on first/last buttons, so a hidden button
   (내보내기/가져오기) can't leave a corner square. */
.corner-actions {
  position: fixed;
  top: var(--safe-top);
  z-index: 21;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--card);
  border: 1px solid var(--border);
}

.corner-actions button {
  padding: 6px 10px;
  font-size: 0.75rem;
  white-space: nowrap;
  border-radius: 0;
  background: var(--card);
  color: var(--fg);
  border: none;
}

.corner-actions button + button {
  border-top: 1px solid var(--border);
}

.corner-actions button:hover:not(:disabled) {
  filter: brightness(0.97);
}

.corner-actions-left {
  left: var(--safe-left);
  border-left: none;
  border-radius: 0 0 8px 0;
}

/* stretch: both buttons take the wider label's width, so 초기화 and 복구
   are the same size. */
.corner-actions-right {
  right: var(--safe-right);
  align-items: stretch;
  border-right: none;
  border-radius: 0 0 0 8px;
}

/* ---------- Layout ---------- */
.app {
  width: min(1100px, 96vw);
  box-sizing: border-box;
  margin: 0 auto;
  padding: 24px calc(16px + var(--safe-right)) calc(48px + var(--safe-bottom)) calc(16px + var(--safe-left));
  text-align: center;
}

h1 {
  margin: 0 0 4px;
  font-size: 1.6rem;
}

.subtitle {
  margin: 0 0 20px;
  opacity: 0.7;
}

.editable-heading {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
}

.editable-heading .edit-input {
  width: min(420px, 80vw);
  text-align: center;
}

/* ---------- Wheel + play controls ---------- */
.wheel-section {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 16px;
  margin-bottom: 24px;
}

/* The wrap is the stationary bowl; only the canvas inside spins. */
.wheel-wrap {
  position: relative;
  box-sizing: border-box;
  width: var(--wheel-size, 390px);
  max-width: 100%;
  padding: 15px;
  border-radius: 50%;
  background: var(--rim);
  box-shadow:
    0 10px 24px rgba(0, 0, 0, 0.12),
    inset 0 0 0 3px rgba(0, 0, 0, 0.06);
  max-width: 100%;
}

.pointer {
  position: absolute;
  top: 2px;
  left: 50%;
  transform: translateX(-50%);
  width: 0;
  height: 0;
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-top: 24px solid var(--accent);
  filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.25));
  z-index: 3;
}

#wheel {
  display: block;
  width: 100%;
  height: auto;
  aspect-ratio: 1;
  border-radius: 50%;
  transition: transform 4s cubic-bezier(0.17, 0.67, 0.12, 0.99);
}

/* Everyone currently on the wheel, small, between 돌리기 and the board. */
.wheel-roster {
  width: 100%;
  max-width: 640px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}

.wheel-roster-caption {
  margin: 0;
  font-size: 0.72rem;
  opacity: 0.55;
}

.wheel-roster-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 4px 6px;
}

.wheel-roster-list li {
  padding: 2px 8px;
  border: 1px solid var(--border);
  border-radius: 999px;
  background: var(--inset);
  font-size: 0.72rem;
  line-height: 1.5;
  white-space: nowrap;
}

.wheel-roster-list .roster-team {
  opacity: 0.6;
}

.wheel-roster-list .roster-count {
  margin-left: 3px;
  color: var(--accent);
  font-weight: 700;
}

.play-controls {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

/* ---------- Category board ---------- */
.category-board {
  display: flex;
  gap: 12px;
  overflow-x: auto;
  padding-bottom: 12px;
  text-align: left;
  justify-content: flex-start;
  /* Cards settle flush with the left edge after a swipe. */
  scroll-snap-type: x proximity;
  overscroll-behavior-x: contain;
}

/* Sized to the screen: never wider than 260px, and always at least 56px
   narrower than the strip, so part of the next card shows and it's clear
   the row scrolls sideways. */
.category-column {
  flex: 0 0 clamp(210px, calc(100% - 56px), 260px);
  /* Without this a flex item won't shrink below its content, and long
     names would push the card back out past the intended width. */
  min-width: 0;
  box-sizing: border-box;
  scroll-snap-align: start;
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.category-column.drag-over {
  border-color: var(--accent);
  border-style: dashed;
}

.category-column-header {
  display: flex;
  align-items: center;
  gap: 6px;
}

.category-name {
  font-weight: 700;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.category-items {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 6px;
  max-height: 340px;
  overflow-y: auto;
}

.item-row {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 5px 6px;
  background: var(--inset);
  border: 1px solid var(--border);
  border-radius: 8px;
}

.item-row.drag-over {
  border-color: var(--accent);
  border-style: dashed;
}

.item-main {
  display: flex;
  align-items: center;
  gap: 4px;
}

/* How many slices this person gets on the wheel. */
.count-stepper {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
  border: 1px solid var(--border);
  border-radius: 999px;
}

.count-stepper.muted {
  opacity: 0.45;
}

.count-btn {
  padding: 0 7px;
  min-height: 22px;
  border: none;
  border-radius: 999px;
  background: transparent;
  font-size: 0.85rem;
  line-height: 1;
}

.count-value {
  min-width: 1.6em;
  font-size: 0.72rem;
  font-variant-numeric: tabular-nums;
  text-align: center;
}

.count-stepper.multiple .count-value {
  color: var(--accent);
  font-weight: 700;
}

.item-name {
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.item-stats {
  padding-left: 8px;
  font-size: 0.65rem;
  line-height: 1.3;
  opacity: 0.55;
}

.add-item-form {
  display: flex;
  gap: 6px;
}

.add-item-form input {
  flex: 1;
  min-width: 0;
  padding: 6px 8px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--inset);
  color: var(--fg);
  /* 16px minimum keeps iOS Safari from zooming in when the field is focused. */
  font-size: 16px;
}

.add-item-form button {
  padding: 6px 10px;
}

.category-column.add-column {
  align-items: center;
  justify-content: center;
  border-style: dashed;
  min-height: 64px;
}

.add-category-btn {
  white-space: nowrap;
}

/* ---------- Shared small controls ---------- */
.drag-handle {
  opacity: 0.4;
  cursor: grab;
  font-size: 0.8rem;
  line-height: 1;
}

/* Touch/keyboard fallback for reordering, since HTML5 drag-and-drop
   (the ⋮⋮ handles) has no touch equivalent on phones. */
.reorder-buttons {
  display: flex;
  gap: 1px;
}

.reorder-btn {
  padding: 1px 4px;
  font-size: 0.65rem;
}

.icon-btn {
  padding: 2px 6px;
  border: none;
  background: transparent;
  font-size: 0.85rem;
  opacity: 0.6;
}

.icon-btn:hover:not(:disabled) {
  opacity: 1;
  color: var(--accent);
}

.editable-heading .icon-btn {
  font-size: 0.8rem;
}

.edit-input {
  padding: 4px 6px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--inset);
  color: var(--fg);
  /* 16px minimum keeps iOS Safari from zooming in when the field is focused. */
  font-size: 16px;
  width: 100%;
}

.item-checkbox {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  cursor: pointer;
}

.item-checkbox:disabled {
  cursor: not-allowed;
}

button {
  padding: 10px 16px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--card);
  color: var(--fg);
  font-size: 1rem;
  cursor: pointer;
}

button:hover:not(:disabled) {
  filter: brightness(0.95);
}

button:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

input:disabled {
  opacity: 0.6;
  cursor: not-allowed;
}

button.primary {
  background: var(--accent);
  color: #fff;
  border-color: var(--accent);
  font-weight: 600;
}

button.danger {
  background: var(--danger);
  color: #fff;
  border-color: var(--danger);
  font-weight: 600;
}

/* ---------- Confirm dialog ---------- */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 1000;
  padding: 16px;
}

.modal-overlay[hidden] {
  display: none;
}

.modal-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 24px;
  width: min(360px, 100%);
  text-align: center;
  box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
}

#confirm-message {
  margin: 0 0 20px;
  font-size: 1.05rem;
  font-weight: 600;
}

.modal-actions {
  display: flex;
  gap: 10px;
  justify-content: center;
}

.modal-actions button {
  flex: 1;
}

/* ---------- Sync dialog ---------- */
.sync-card {
  width: min(460px, 100%);
  text-align: left;
}

.sync-card h2 {
  margin: 0 0 12px;
  font-size: 1.1rem;
}

.sync-help {
  margin: 0 0 14px;
  font-size: 0.85rem;
  line-height: 1.6;
  color: #b4b4bd;
}

#sync-url-input {
  width: 100%;
  padding: 10px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--inset);
  color: var(--fg);
  /* 16px minimum keeps iOS Safari from zooming in when the field is focused. */
  font-size: 16px;
}

.sync-status {
  margin: 12px 0 18px;
  min-height: 1.3em;
  font-size: 0.85rem;
  line-height: 1.5;
  word-break: break-word;
}

.sync-status.ok {
  color: #8fe3b0;
}

.sync-status.error {
  color: #ff8fa3;
}

.sync-status.busy {
  color: #ffe58f;
}

/* The connection state rides on the corner button itself, so it's visible
   without opening the dialog. */
#sync-dot {
  margin-left: 4px;
  font-size: 0.7em;
  vertical-align: middle;
}

#sync-btn.sync-ok #sync-dot {
  color: #8fe3b0;
}

#sync-btn.sync-error #sync-dot {
  color: #ff8fa3;
}

#sync-btn.sync-busy #sync-dot {
  color: #ffe58f;
}

/* ---------- Confetti ---------- */
#confetti-canvas {
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100vh;
  pointer-events: none;
  z-index: 999;
}

/* ---------- Touch targets ----------
   pointer:coarse (touchscreens, not just narrow windows) targets real
   phones/tablets specifically, since the buttons below are sized fine
   for a mouse cursor but too small to reliably tap with a finger. */
@media (pointer: coarse) {
  .icon-btn {
    padding: 8px;
    font-size: 1rem;
    min-width: 36px;
    min-height: 36px;
  }

  .reorder-btn {
    padding: 6px 9px;
    font-size: 0.85rem;
    min-width: 32px;
    min-height: 32px;
  }

  .item-checkbox {
    width: 22px;
    height: 22px;
  }

  .item-main .icon-btn {
    padding: 2px;
    min-width: 28px;
    min-height: 32px;
  }

  .count-btn {
    padding: 0 7px;
    min-height: 30px;
  }

  /* HTML5 drag-and-drop doesn't work with a finger, so on touchscreens
     the ⋮⋮ handles only take room from the names. */
  .drag-handle {
    display: none;
  }

  .add-item-form button {
    padding: 8px 14px;
    min-height: 36px;
  }

  .corner-actions button {
    padding: 10px 14px;
    font-size: 0.8rem;
  }
}

/* ---------- Phones ---------- */
@media (max-width: 640px) {
  h1 {
    font-size: 1.4rem;
  }

  .subtitle {
    margin-bottom: 14px;
  }
}

/* The corner stacks sit either side of the result line, so on the
   narrowest phones every pixel of their width comes out of the text.
   Slimmer sides, same tap height. */
@media (max-width: 400px) {
  .corner-actions button {
    min-height: 36px;
    padding: 4px 8px;
    font-size: 0.72rem;
  }
}

/* Stable "screen height with the browser toolbars showing", read by
   fitLayout(). Unlike innerHeight it doesn't change as the address bar
   slides away while scrolling, so the wheel doesn't jump around. */
#viewport-probe {
  position: fixed;
  top: 0;
  left: 0;
  width: 0;
  height: 100vh;
  height: 100svh;
  visibility: hidden;
  pointer-events: none;
}
</style>
</head>
<body>
  <div class="corner-actions corner-actions-left">
    <button id="sync-btn" type="button">동기화<span id="sync-dot"></span></button>
    <!-- Taken off screen now that sheet sync exists, but kept working:
         remove `hidden` from both buttons to bring them back. -->
    <button id="export-btn" type="button" hidden>내보내기</button>
    <button id="import-btn" type="button" hidden>가져오기</button>
    <input id="import-file-input" type="file" accept="application/json,.json" hidden>
  </div>

  <div class="corner-actions corner-actions-right">
    <button id="reset-wins-btn" type="button">당첨횟수 초기화</button>
    <button id="restore-wins-btn" type="button">당첨횟수 복구</button>
  </div>

  <div class="result-banner">
    <div class="banner-inner">
      <p id="result" aria-live="polite">룰렛을 돌려보세요</p>
    </div>
  </div>

  <main class="app">
    <h1 id="board-title" class="editable-heading"></h1>
    <p id="board-subtitle" class="subtitle editable-heading"></p>

    <div class="wheel-section">
      <div class="wheel-wrap">
        <div class="pointer"></div>
        <canvas id="wheel" width="360" height="360"></canvas>
      </div>

      <div class="play-controls">
        <button id="spin-btn" class="primary">돌리기</button>
      </div>

      <div id="wheel-roster" class="wheel-roster"></div>
    </div>

    <div id="category-board" class="category-board"></div>
  </main>

  <canvas id="confetti-canvas"></canvas>
  <div id="viewport-probe" aria-hidden="true"></div>

  <div id="confirm-dialog" class="modal-overlay" hidden>
    <div class="modal-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-message">
      <p id="confirm-message">정말 제거하시겠습니까?</p>
      <div class="modal-actions">
        <button id="confirm-cancel-btn" type="button">취소</button>
        <button id="confirm-ok-btn" type="button" class="danger">제거</button>
      </div>
    </div>
  </div>

  <div id="sync-dialog" class="modal-overlay" hidden>
    <div class="modal-card sync-card" role="dialog" aria-modal="true" aria-labelledby="sync-dialog-title">
      <h2 id="sync-dialog-title">동료와 당첨 기록 공유</h2>
      <p class="sync-help">
        구글 시트 하나에 명단과 당첨 기록을 자동으로 저장하고 불러옵니다.
        같은 주소를 넣은 사람끼리 기록이 실시간에 가깝게 공유됩니다.
        주소를 만드는 방법은 README의 “동료들과 당첨 기록 공유하기”를 참고하세요.
      </p>
      <input id="sync-url-input" type="url" inputmode="url" autocomplete="off" spellcheck="false"
             placeholder="https://script.google.com/macros/s/..../exec">
      <p id="sync-status-text" class="sync-status"></p>
      <div class="modal-actions">
        <button id="sync-cancel-btn" type="button">취소</button>
        <button id="sync-disconnect-btn" type="button" class="danger">연결 해제</button>
        <button id="sync-connect-btn" type="button" class="primary">연결</button>
      </div>
    </div>
  </div>
  <script>
    // Winner-picking logic. `random` is injectable so it can be tested
    // deterministically; the app itself always calls it with Math.random.
    const Roulette = (function () {
      function pickWinnerIndex(itemCount, random) {
        if (!Number.isInteger(itemCount) || itemCount <= 0) {
          throw new RangeError("itemCount must be a positive integer");
        }
        const rand = typeof random === "function" ? random : Math.random;
        return Math.floor(rand() * itemCount);
      }
      return { pickWinnerIndex };
    })();
  </script>
  <script>
(function () {
  const STORAGE_KEY = "roulette-state-v1";
  const DAY_MS = 24 * 60 * 60 * 1000;
  const WEEK_MS = 7 * DAY_MS;
  const FOUR_WEEKS_MS = 28 * DAY_MS;
  // The original fixed spin was 1800 degrees over 4 seconds.
  const BASE_DEG_PER_SEC = 450;

  const SLICE_COLORS = ["#ff8fa3", "#ffc38f", "#ffe58f", "#8fe3b0", "#8fd3f4", "#c9a8f5"];
  const CONFETTI_COLORS = ["#ff8fa3", "#ffc38f", "#ffe58f", "#8fe3b0", "#8fd3f4", "#c9a8f5", "#ffffff"];

  // How many slices one person can take on the wheel.
  const MAX_ENTRIES_PER_ITEM = 10;
  const canvas = document.getElementById("wheel");
  const ctx = canvas.getContext("2d");
  const confettiCanvas = document.getElementById("confetti-canvas");
  const confettiCtx = confettiCanvas.getContext("2d");

  const titleEl = document.getElementById("board-title");
  const subtitleEl = document.getElementById("board-subtitle");
  const categoryBoard = document.getElementById("category-board");
  const spinBtn = document.getElementById("spin-btn");
  const wheelRoster = document.getElementById("wheel-roster");
  const result = document.getElementById("result");
  const resetWinsBtn = document.getElementById("reset-wins-btn");
  const restoreWinsBtn = document.getElementById("restore-wins-btn");
  const exportBtn = document.getElementById("export-btn");
  const importBtn = document.getElementById("import-btn");
  const importFileInput = document.getElementById("import-file-input");

  const syncBtn = document.getElementById("sync-btn");
  const syncDot = document.getElementById("sync-dot");
  const syncDialog = document.getElementById("sync-dialog");
  const syncUrlInput = document.getElementById("sync-url-input");
  const syncStatusText = document.getElementById("sync-status-text");
  const syncConnectBtn = document.getElementById("sync-connect-btn");
  const syncDisconnectBtn = document.getElementById("sync-disconnect-btn");
  const syncCancelBtn = document.getElementById("sync-cancel-btn");

  const confirmDialog = document.getElementById("confirm-dialog");
  const confirmMessage = document.getElementById("confirm-message");
  const confirmOkBtn = document.getElementById("confirm-ok-btn");
  const confirmCancelBtn = document.getElementById("confirm-cancel-btn");
  let nextId = 1;
  function makeId(prefix) {
    return `${prefix}-${nextId++}`;
  }

  function clampEntryCount(value) {
    const n = Math.round(Number(value));
    return Number.isFinite(n) ? Math.min(MAX_ENTRIES_PER_ITEM, Math.max(1, n)) : 1;
  }

  function createSeedCategories() {
    return [
      {
        id: makeId("cat"),
        name: "사업팀",
        items: [
          { id: makeId("item"), name: "김사원", included: true, count: 1, wins: [] },
          { id: makeId("item"), name: "하대리", included: true, count: 1, wins: [] },
        ],
      },
      {
        id: makeId("cat"),
        name: "홍보팀",
        items: [
          { id: makeId("item"), name: "박팀장", included: true, count: 1, wins: [] },
          { id: makeId("item"), name: "이주임", included: true, count: 1, wins: [] },
        ],
      },
    ];
  }

  let categories = [];
  let boardTitle = "커피 룰렛";
  let boardSubtitle = "오늘 행운의 커피 구매자는?";
  let winsBackup = null;

  let editingHeaderField = null;
  let editingCategoryId = null;
  let addingCategory = false;
  let editingItemId = null;

  let rotation = 0;
  let spinning = false;
  let confettiAnimationId = null;

  // ---------- Persistence ----------
  function serializeState() {
    return {
      version: 1,
      title: boardTitle,
      subtitle: boardSubtitle,
      categories,
      winsBackup,
      nextId,
      volume: masterVolume,
      muted,
    };
  }

  // Shared by loadState() (localStorage) and importState() (a file the
  // user picked), so both go through the same validation/normalization.
  function applyStateData(data) {
    if (!data || !Array.isArray(data.categories)) return false;

    categories = data.categories.map((category) => ({
      id: String(category.id),
      name: String(category.name),
      items: Array.isArray(category.items)
        ? category.items.map((item) => ({
            id: String(item.id),
            name: String(item.name),
            included: item.included !== false,
            count: clampEntryCount(item.count),
            wins: Array.isArray(item.wins) ? item.wins.filter((t) => typeof t === "number") : [],
          }))
        : [],
    }));

    if (typeof data.title === "string" && data.title.trim()) boardTitle = data.title;
    if (typeof data.subtitle === "string" && data.subtitle.trim()) boardSubtitle = data.subtitle;
    winsBackup = data.winsBackup && typeof data.winsBackup === "object" ? data.winsBackup : null;
    if (typeof data.volume === "number") masterVolume = Math.min(1, Math.max(0, data.volume));
    muted = data.muted === true;
    if (Number.isFinite(data.nextId)) nextId = data.nextId;

    // Guard against id collisions if the stored/imported counter drifted.
    let highest = nextId - 1;
    categories.forEach((category) => {
      [category, ...category.items].forEach((entity) => {
        const match = /-(\d+)$/.exec(entity.id);
        if (match) highest = Math.max(highest, Number(match[1]));
      });
    });
    nextId = highest + 1;

    return true;
  }

  function saveState() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(serializeState()));
    } catch (e) {
      // Storage can be unavailable (private mode, quota); the app still
      // works for the current session without it.
    }
    // No-op unless a shared sheet is connected.
    queueRosterPush();
  }

  function loadState() {
    let raw = null;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      return false;
    }
    if (!raw) return false;

    try {
      return applyStateData(JSON.parse(raw));
    } catch (e) {
      return false;
    }
  }

  // ---------- Import ----------
  async function importStateFromFile(file) {
    let data;
    try {
      data = JSON.parse(await file.text());
    } catch (e) {
      window.alert("파일을 읽을 수 없습니다. 올바른 백업 파일인지 확인해주세요.");
      return;
    }
    if (!data || !Array.isArray(data.categories)) {
      window.alert("올바른 백업 파일 형식이 아닙니다.");
      return;
    }

    const ok = await showConfirm(
      syncUrl
        ? "현재 데이터와 연결된 구글 시트의 내용을 모두 가져온 파일 내용으로 덮어씁니다. 계속하시겠습니까?"
        : "현재 데이터를 가져온 파일 내용으로 덮어씁니다. 계속하시겠습니까?",
      "가져오기",
      true
    );
    if (!ok) return;

    applyStateData(data);
    editingHeaderField = null;
    editingCategoryId = null;
    addingCategory = false;
    editingItemId = null;
    applyVolume();
    renderAll();

    // The sheet is the shared source of truth, so an import has to replace
    // it too; otherwise the next pull would undo what was just imported.
    if (syncUrl) await syncNow(fullPushPayload());
  }

  // ---------- Google Sheet sync ----------
  // Entirely optional: with no sheet URL configured the app behaves exactly
  // as before (localStorage only). Once a URL is set, the roster and the win
  // log live in a shared Google Sheet, so everyone who connects to the same
  // sheet sees the same numbers. localStorage stays in place underneath as
  // the offline fallback.
  const SYNC_URL_KEY = "roulette-sync-url";
  const SYNC_QUEUE_KEY = "roulette-sync-queue";
  const SYNC_ROSTER_KEY = "roulette-sync-roster";
  const SYNC_RENAMES_KEY = "roulette-sync-renames";
  const SYNC_POLL_MS = 30 * 1000;
  const ROSTER_PUSH_DELAY_MS = 1200;
  // Apps Script is called with a GET query string so the request stays a
  // "simple" one (no CORS preflight, which Apps Script web apps don't
  // answer). POST is only used when a payload outgrows what a URL can carry.
  const SYNC_MAX_URL = 6000;
  const KEY_SEP = "\u0000";

  let syncUrl = "";
  let syncStatus = "off"; // off | busy | ok | error
  let syncRun = null; // the in-flight request chain, if any
  let syncRequested = false; // a sync was asked for while one was running
  let syncConnecting = false; // the connect dialog is talking to a new URL
  let hasRemoteBackup = false;
  let pendingWins = [];
  let pendingRenames = [];
  let pushedRosterSignature = null;
  let rosterPushTimer = null;

  function readStored(key) {
    try {
      return localStorage.getItem(key);
    } catch (e) {
      return null;
    }
  }

  function writeStored(key, value) {
    try {
      if (value === null) localStorage.removeItem(key);
      else localStorage.setItem(key, value);
    } catch (e) {
      // Same tolerance as saveState(): storage may simply be unavailable.
    }
  }

  function loadSyncSettings() {
    syncUrl = readStored(SYNC_URL_KEY) || "";
    // Remembered across reloads so an edit made while offline is still
    // recognised as "not on the sheet yet" the next time we connect.
    pushedRosterSignature = readStored(SYNC_ROSTER_KEY);
    try {
      const parsed = JSON.parse(readStored(SYNC_QUEUE_KEY) || "[]");
      pendingWins = Array.isArray(parsed) ? parsed.filter((win) => win && Number.isFinite(win.at)) : [];
    } catch (e) {
      pendingWins = [];
    }
    try {
      const parsed = JSON.parse(readStored(SYNC_RENAMES_KEY) || "[]");
      pendingRenames = Array.isArray(parsed) ? parsed : [];
    } catch (e) {
      pendingRenames = [];
    }
    syncStatus = syncUrl ? "busy" : "off";
  }

  function savePendingWins() {
    writeStored(SYNC_QUEUE_KEY, JSON.stringify(pendingWins));
  }

  // Opening the /exec URL in a browser tab lands on a one-off
  // script.googleusercontent.com/macros/echo?... address. It looks right and
  // even answers once, but it's a cached copy of that single response: later
  // requests never reach the script, so writes are dropped and every pull
  // returns the same stale (usually empty) data, wiping the board. Refuse it.
  function syncUrlProblem(url) {
    if (/script\.googleusercontent\.com|\/macros\/echo/i.test(url)) {
      return "브라우저 주소창의 주소가 아니라, Apps Script 배포 화면의 '웹 앱 URL'(/exec 로 끝나는 주소)을 넣어주세요.";
    }
    return "";
  }

  // Win rows in the sheet are identified by category + item name, so a
  // rename has to be carried over to the existing rows or that person's
  // history would silently detach from them. An empty `fromName` means
  // "every row in this category" (i.e. the category itself was renamed).
  function noteRename(fromCategory, fromName, toCategory, toName) {
    if (!syncUrl) return;
    if (fromCategory === toCategory && fromName === toName) return;
    pendingRenames.push({ fromCategory, fromName, toCategory, toName });
    writeStored(SYNC_RENAMES_KEY, JSON.stringify(pendingRenames));
  }

  async function callSync(payload) {
    const body = JSON.stringify(payload);
    const asQuery =
      syncUrl + (syncUrl.indexOf("?") === -1 ? "?" : "&") + "p=" + encodeURIComponent(body);

    const response =
      asQuery.length <= SYNC_MAX_URL
        ? await fetch(asQuery, { method: "GET", redirect: "follow" })
        : await fetch(syncUrl, {
            method: "POST",
            redirect: "follow",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body,
          });

    if (!response.ok) throw new Error(`시트 서버가 오류를 반환했습니다 (HTTP ${response.status}).`);

    let data;
    try {
      data = await response.json();
    } catch (e) {
      throw new Error("응답을 읽지 못했습니다. 웹 앱 주소와 '액세스 권한: 모든 사용자' 설정을 확인해주세요.");
    }
    if (!data || data.ok !== true) throw new Error((data && data.error) || "시트에서 오류를 반환했습니다.");
    return data;
  }

  // ---------- Snapshot <-> local state ----------
  // A category with no items still gets one row (with an empty name) so it
  // survives a round trip through the sheet.
  function rosterPayload() {
    const rows = [];
    categories.forEach((category) => {
      if (!category.items.length) rows.push([category.name, "", true, 1]);
      category.items.forEach((item) => rows.push([category.name, item.name, item.included, item.count]));
    });
    return rows;
  }

  function winsPayload() {
    const rows = [];
    categories.forEach((category) => {
      category.items.forEach((item) => {
        item.wins.forEach((at) => rows.push([at, category.name, item.name]));
      });
    });
    return rows;
  }

  function fullPushPayload() {
    return {
      action: "push",
      roster: rosterPayload(),
      wins: winsPayload(),
      title: boardTitle,
      subtitle: boardSubtitle,
    };
  }

  function rosterSignature() {
    return JSON.stringify([rosterPayload(), boardTitle, boardSubtitle]);
  }

  function rememberPushedRoster() {
    pushedRosterSignature = rosterSignature();
    // Only meaningful while connected; don't leave sync keys behind for
    // someone who never turns sync on.
    if (syncUrl) writeStored(SYNC_ROSTER_KEY, pushedRosterSignature);
  }

  // Returns the write the sheet is still missing, or null when it's current.
  function pendingRosterAction() {
    if (rosterSignature() === pushedRosterSignature && !pendingRenames.length) return null;
    return {
      action: "roster",
      roster: rosterPayload(),
      renames: pendingRenames,
      title: boardTitle,
      subtitle: boardSubtitle,
    };
  }

  function applySnapshot(data) {
    const winsByKey = new Map();
    (data.wins || []).forEach((row) => {
      const key = String(row[1]) + KEY_SEP + String(row[2]);
      if (!winsByKey.has(key)) winsByKey.set(key, []);
      winsByKey.get(key).push(Number(row[0]));
    });

    // Reuse the ids already assigned to the same category/item names, so a
    // pull that changes nothing doesn't churn the DOM or the wheel.
    const categoryIds = new Map();
    const itemIds = new Map();
    const itemCounts = new Map();
    categories.forEach((category) => {
      categoryIds.set(category.name, category.id);
      category.items.forEach((item) => {
        itemIds.set(category.name + KEY_SEP + item.name, item.id);
        itemCounts.set(category.name + KEY_SEP + item.name, item.count);
      });
    });

    const grouped = new Map();
    (data.roster || []).forEach((row) => {
      const categoryName = String(row[0]);
      if (!grouped.has(categoryName)) grouped.set(categoryName, []);
      const itemName = String(row[1]);
      // A sheet still running the older script has no count column; keep
      // this device's count then, rather than resetting everyone to 1.
      if (itemName) grouped.get(categoryName).push({ name: itemName, included: row[2] !== false, count: row[3] });
    });

    categories = Array.from(grouped, ([categoryName, items]) => ({
      id: categoryIds.get(categoryName) || makeId("category"),
      name: categoryName,
      items: items.map((entry) => {
        const key = categoryName + KEY_SEP + entry.name;
        return {
          id: itemIds.get(key) || makeId("item"),
          name: entry.name,
          included: entry.included,
          count: entry.count === undefined || entry.count === null ? itemCounts.get(key) || 1 : clampEntryCount(entry.count),
          wins: (winsByKey.get(key) || []).slice().sort((a, b) => a - b),
        };
      }),
    }));

    if (typeof data.title === "string" && data.title.trim()) boardTitle = data.title;
    if (typeof data.subtitle === "string" && data.subtitle.trim()) boardSubtitle = data.subtitle;
    hasRemoteBackup = data.hasBackup === true;
    // What we just applied *is* what the sheet holds, so don't echo it back.
    rememberPushedRoster();
  }

  // ---------- Status indicator ----------
  const SYNC_TITLES = {
    off: "동기화 꺼짐 — 눌러서 구글 시트에 연결",
    busy: "구글 시트와 동기화하는 중...",
    ok: "구글 시트와 연결됨",
    error: "동기화 실패",
  };

  function setSyncStatus(status, message) {
    syncStatus = status;
    syncDot.textContent = status === "off" ? "" : "●";
    syncBtn.className = status === "off" ? "" : `sync-${status}`;
    syncBtn.title = message ? `${SYNC_TITLES[status]}: ${message}` : SYNC_TITLES[status];
  }

  // ---------- The one place that talks to the sheet ----------
  // Every write returns a fresh full snapshot, so a single round trip both
  // saves our change and picks up everyone else's.
  // One request chain at a time. A plain refresh asked for while one is
  // running (a new win, a roster edit, a poll) is folded into a follow-up
  // run; an explicit action (초기화, 복구, 가져오기) waits its turn instead of
  // being dropped.
  async function syncNow(extraAction) {
    if (!syncUrl || syncConnecting) return null;
    // Also covers a bad address saved before this check existed: stop before
    // a stale response can overwrite the local board.
    const problem = syncUrlProblem(syncUrl);
    if (problem) {
      setSyncStatus("error", problem);
      return null;
    }

    while (syncRun) {
      if (!extraAction) {
        syncRequested = true;
        return null;
      }
      await syncRun;
    }

    syncRun = runSync(extraAction);
    try {
      return await syncRun;
    } finally {
      syncRun = null;
      const again = syncRequested;
      syncRequested = false;
      // Not after an error: the regular poll retries, instead of hammering.
      if (again && syncStatus === "ok") syncNow();
    }
  }

  async function runSync(extraAction) {
    setSyncStatus("busy");

    try {
      let data = null;
      // The roster as it was when the request whose reply we keep was sent.
      let sentSignature = null;

      // Wins queued while offline go first: a snapshot must never overwrite
      // a result that hasn't reached the sheet yet.
      while (pendingWins.length) {
        const win = pendingWins[0];
        sentSignature = rosterSignature();
        data = await callSync({ action: "win", at: win.at, category: win.category, name: win.name });
        pendingWins.shift();
        savePendingWins();
      }

      const action = extraAction || pendingRosterAction();
      if (action) {
        sentSignature = rosterSignature();
        data = await callSync(action);
        // Only on success (a thrown error leaves them queued), and only the
        // renames actually sent: one made while this was out still has to go.
        if (action.action === "roster") {
          pendingRenames = pendingRenames.slice(action.renames.length);
          writeStored(SYNC_RENAMES_KEY, pendingRenames.length ? JSON.stringify(pendingRenames) : null);
        }
      }
      if (!data) {
        sentSignature = rosterSignature();
        data = await callSync({ action: "pull" });
      }

      hasRemoteBackup = data.hasBackup === true;

      // A reply describes the sheet as of when its request left, and a real
      // Apps Script round trip takes seconds. If the board changed in the
      // meantime, applying the reply would undo that change -- and for a
      // rename, the rename itself would still be sent later, filing the
      // person's history under a name the roster no longer has. Keep the
      // local board and go round again with the newer state instead.
      const changedMeanwhile = rosterSignature() !== sentSignature || pendingWins.length > 0;
      if (changedMeanwhile) {
        syncRequested = true;
      } else if (!isBusy()) {
        // (If an inline editor is open, the next poll applies it.)
        applySnapshot(data);
        renderAll();
      } else {
        renderTopActions();
      }
      setSyncStatus("ok");
      return data;
    } catch (e) {
      setSyncStatus("error", e.message || String(e));
      return null;
    }
  }

  // Called from saveState() on every render, so it has to be cheap and
  // debounced: typing a name or reordering fires several renders in a row.
  function queueRosterPush() {
    if (!syncUrl || !pendingRosterAction()) return;
    clearTimeout(rosterPushTimer);
    // If a sync happens to be in flight, it runs again once that finishes.
    rosterPushTimer = setTimeout(() => syncNow(), ROSTER_PUSH_DELAY_MS);
  }

  // ---------- Sync dialog ----------
  function setDialogStatus(kind, message) {
    syncStatusText.className = `sync-status ${kind}`;
    syncStatusText.textContent = message;
  }

  // `prefill` keeps a URL the user just typed in the field when the dialog
  // has to reopen (e.g. they backed out of the overwrite confirmation),
  // instead of making them paste it again.
  function openSyncDialog(prefill) {
    syncUrlInput.value = prefill === undefined ? syncUrl : prefill;
    syncDisconnectBtn.hidden = !syncUrl;
    setDialogStatus(
      syncUrl ? "ok" : "",
      syncUrl ? "이 기기는 위 시트에 연결되어 있습니다." : ""
    );
    syncDialog.hidden = false;
    requestAnimationFrame(() => syncUrlInput.focus());
  }

  function closeSyncDialog() {
    syncDialog.hidden = true;
  }

  function setDialogBusy(busy) {
    syncConnectBtn.disabled = busy;
    syncDisconnectBtn.disabled = busy;
    syncUrlInput.disabled = busy;
  }

  // syncUrl temporarily points at the new address while connecting, so keep
  // background polls out until the user has settled on it: a poll landing
  // mid-way could apply the sheet's contents before the overwrite prompt.
  async function connectSync(url) {
    syncConnecting = true;
    try {
      await connectSyncSteps(url);
    } finally {
      syncConnecting = false;
    }
  }

  async function connectSyncSteps(url) {
    const previousUrl = syncUrl;
    syncUrl = url;
    setDialogBusy(true);
    setDialogStatus("busy", "시트에 연결하는 중...");

    let data;
    try {
      data = await callSync({ action: "pull" });
    } catch (e) {
      syncUrl = previousUrl;
      setDialogBusy(false);
      setDialogStatus("error", e.message || String(e));
      return;
    }

    // An empty sheet is the first person setting things up, so seed it from
    // this device instead of wiping their board with nothing.
    if (!data.roster || !data.roster.length) {
      try {
        const seed = fullPushPayload();
        data = await callSync(seed);
        // Every write answers with the sheet's contents afterwards. If what
        // we just wrote isn't in there, the address isn't really reaching
        // the script -- fail loudly instead of wiping this board.
        if (seed.roster.length && (!data.roster || !data.roster.length)) {
          throw new Error("시트에 저장되지 않았습니다. '웹 앱 URL'(/exec 로 끝나는 주소)이 맞는지 확인해주세요.");
        }
      } catch (e) {
        syncUrl = previousUrl;
        setDialogBusy(false);
        setDialogStatus("error", e.message || String(e));
        return;
      }
      setDialogBusy(false);
      finishConnect(url, data);
      window.alert("이 기기의 명단과 당첨 기록을 시트에 올렸습니다.\n동료들이 같은 주소로 연결하면 기록이 공유됩니다.");
      return;
    }

    setDialogBusy(false);
    closeSyncDialog();
    const ok = await showConfirm(
      "시트에 이미 저장된 내용이 있습니다. 이 기기의 명단과 당첨 기록을 시트 내용으로 바꿉니다. 계속하시겠습니까?",
      "불러오기",
      true
    );
    if (!ok) {
      syncUrl = previousUrl;
      openSyncDialog(url);
      setDialogStatus("", "연결하지 않았습니다.");
      return;
    }
    finishConnect(url, data);
  }

  function finishConnect(url, data) {
    syncUrl = url;
    writeStored(SYNC_URL_KEY, url);
    applySnapshot(data);
    editingHeaderField = null;
    editingCategoryId = null;
    addingCategory = false;
    editingItemId = null;
    renderAll();
    setSyncStatus("ok");
    closeSyncDialog();
  }

  async function disconnectSync() {
    closeSyncDialog();
    const ok = await showConfirm(
      "시트 연결을 끊습니다. 지금까지의 내용은 이 기기에 그대로 남지만, 이후 변경은 시트에 반영되지 않습니다. 계속하시겠습니까?",
      "연결 해제",
      true
    );
    if (!ok) {
      openSyncDialog();
      return;
    }
    syncUrl = "";
    pendingWins = [];
    pendingRenames = [];
    pushedRosterSignature = null;
    hasRemoteBackup = false;
    writeStored(SYNC_URL_KEY, null);
    writeStored(SYNC_QUEUE_KEY, null);
    writeStored(SYNC_ROSTER_KEY, null);

  // ---------- Audio ----------
  let audioCtx = null;
  let masterGain = null;
  let masterVolume = 0.6;
  let muted = false;

  function ensureAudioCtx() {
    const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
    if (!AudioCtxClass) return null;
    if (!audioCtx) {
      audioCtx = new AudioCtxClass();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = muted ? 0 : masterVolume;
      masterGain.connect(audioCtx.destination);
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
    return audioCtx;
  }

  function applyVolume() {
    if (masterGain) masterGain.gain.value = muted ? 0 : masterVolume;
  }

  function playClick() {
    const ac = ensureAudioCtx();
    if (!ac) return;
    try {
      const osc = ac.createOscillator();
      const gain = ac.createGain();
      osc.type = "square";
      osc.frequency.value = 700;
      const start = ac.currentTime;
      gain.gain.setValueAtTime(0.0001, start);
      gain.gain.exponentialRampToValueAtTime(0.15, start + 0.005);
      gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.06);
      osc.connect(gain).connect(masterGain);
      osc.start(start);
      osc.stop(start + 0.07);
    } catch (e) {
      // Ignore playback failures (e.g. autoplay restrictions).
    }
  }

  function scheduleTick(atTime) {
    if (!audioCtx) return;
    try {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = "square";
      osc.frequency.value = 1000;
      gain.gain.setValueAtTime(0.0001, atTime);
      gain.gain.exponentialRampToValueAtTime(0.14, atTime + 0.003);
      gain.gain.exponentialRampToValueAtTime(0.0001, atTime + 0.03);
      osc.connect(gain).connect(masterGain);
      osc.start(atTime);
      osc.stop(atTime + 0.04);
    } catch (e) {
      // Ignore playback failures.
    }
  }

  // Synthesizes a short ascending fanfare with the Web Audio API so no
  // external audio asset is needed; playback failures are non-fatal.
  function playFanfare() {
    if (!audioCtx) return;
    try {
      const notes = [523.25, 659.25, 783.99, 1046.5]; // C5 E5 G5 C6
      notes.forEach((freq, i) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = "square";
        osc.frequency.value = freq;
        const start = audioCtx.currentTime + i * 0.12;
        gain.gain.setValueAtTime(0.0001, start);
        gain.gain.exponentialRampToValueAtTime(0.2, start + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, start + 0.3);
        osc.connect(gain).connect(masterGain);
        osc.start(start);
        osc.stop(start + 0.35);
      });
    } catch (e) {
      // Ignore playback failures (e.g. autoplay restrictions).
    }
  }

  // Evaluates a CSS-style cubic-bezier(p1x,p1y,p2x,p2y) easing at time
  // fraction t, via binary search over the bezier's parametric variable.
  function makeCubicBezierEasing(p1x, p1y, p2x, p2y) {
    function sampleX(u) {
      const mu = 1 - u;
      return 3 * mu * mu * u * p1x + 3 * mu * u * u * p2x + u * u * u;
    }
    function sampleY(u) {
      const mu = 1 - u;
      return 3 * mu * mu * u * p1y + 3 * mu * u * u * p2y + u * u * u;
    }
    return function progressAt(t) {
      let lower = 0;
      let upper = 1;
      let u = t;
      for (let i = 0; i < 20; i++) {
        const x = sampleX(u);
        if (Math.abs(x - t) < 1e-4) break;
        if (x < t) lower = u;
        else upper = u;
        u = (lower + upper) / 2;
      }
      return sampleY(u);
    };
  }

  const wheelEasing = makeCubicBezierEasing(0.17, 0.67, 0.12, 0.99);

  function findTimeFractionForProgress(targetProgress) {
    let lower = 0;
    let upper = 1;
    let t = targetProgress;
    for (let i = 0; i < 20; i++) {
      const p = wheelEasing(t);
      if (Math.abs(p - targetProgress) < 1e-4) break;
      if (p < targetProgress) lower = t;
      else upper = t;
      t = (lower + upper) / 2;
    }
    return t;
  }

  // Schedules a click for every slice boundary that passes the fixed
  // pointer while the wheel rotates from startRotation to endRotation,
  // timed to match the CSS transition's easing so the "roulette ticking"
  // sound speeds up and slows down together with the visual spin.
  function scheduleSpinTicks(startRotation, endRotation, sliceAngle, durationMs) {
    if (!audioCtx) return;
    const pointerAngle = 270;
    const totalDelta = endRotation - startRotation;
    if (totalDelta <= 0) return;

    const phase = ((pointerAngle % sliceAngle) + sliceAngle) % sliceAngle;
    let firstBoundary = startRotation + ((((phase - startRotation) % sliceAngle) + sliceAngle) % sliceAngle);
    if (firstBoundary <= startRotation) firstBoundary += sliceAngle;

    const baseTime = audioCtx.currentTime;
    for (let r = firstBoundary; r <= endRotation; r += sliceAngle) {
      const progress = (r - startRotation) / totalDelta;
      const timeFraction = findTimeFractionForProgress(progress);
      scheduleTick(baseTime + (timeFraction * durationMs) / 1000);
    }
  }

  // ---------- Confirm dialog ----------
  function showConfirm(message, confirmLabel, danger) {
    return new Promise((resolve) => {
      confirmMessage.textContent = message;
      confirmOkBtn.textContent = confirmLabel || "제거";
      confirmOkBtn.className = danger === false ? "primary" : "danger";
      confirmDialog.hidden = false;

      function onKeydown(e) {
        if (e.key === "Escape") cleanup(false);
      }
      function onOverlayClick(e) {
        if (e.target === confirmDialog) cleanup(false);
      }
      function cleanup(value) {
        confirmDialog.hidden = true;
        confirmOkBtn.removeEventListener("click", onOk);
        confirmCancelBtn.removeEventListener("click", onCancel);
        confirmDialog.removeEventListener("click", onOverlayClick);
        document.removeEventListener("keydown", onKeydown);
        resolve(value);
      }
      function onOk() {
        playClick();
        cleanup(true);
      }
      function onCancel() {
        playClick();
        cleanup(false);
      }

      confirmOkBtn.addEventListener("click", onOk);
      confirmCancelBtn.addEventListener("click", onCancel);
      confirmDialog.addEventListener("click", onOverlayClick);
      document.addEventListener("keydown", onKeydown);
      requestAnimationFrame(() => confirmCancelBtn.focus());
    });
  }

  // ---------- Derived data ----------
  // The wheel spins over items marked "included", regardless of which
  // category they belong to, so a single roulette can mix e.g. 사업팀's
  // 김사원 with 홍보팀's 박팀장. Each entry keeps a reference to the real
  // item object (not a copy) so callers can mutate it.
  // Someone put in N times gets N slices, spaced as evenly around the wheel
  // as possible rather than side by side (which would just look like one
  // wide slice). People with the most slices are placed first, while the
  // wheel is emptiest: each copy aims for an evenly spaced position and
  // takes the nearest free slot. Everyone else then fills the gaps in board
  // order, so with everyone at 1 the wheel is simply the board order.
  function getWheelEntries() {
    const people = [];
    categories.forEach((category) => {
      category.items.forEach((item) => {
        if (item.included) people.push({ item, categoryName: category.name });
      });
    });

    const total = people.reduce((sum, person) => sum + person.item.count, 0);
    const slots = new Array(total).fill(null);
    const mostFirst = people
      .map((person, index) => ({ person, index }))
      .sort((a, b) => b.person.item.count - a.person.item.count || a.index - b.index);

    mostFirst.forEach(({ person }) => {
      const copies = person.item.count;
      const start = slots.indexOf(null);
      for (let k = 0; k < copies; k++) {
        const ideal = Math.round(start + (k * total) / copies) % total;
        for (let d = 0; d < total; d++) {
          const after = (ideal + d) % total;
          if (slots[after] === null) {
            slots[after] = person;
            break;
          }
          const before = (ideal - d + total) % total;
          if (slots[before] === null) {
            slots[before] = person;
            break;
          }
        }
      }
    });
    return slots;
  }

  // A draw needs two different people; one person in three slices isn't one.
  function countPeople(entries) {
    return new Set(entries.map((entry) => entry.item)).size;
  }

  function reorder(array, fromIndex, toIndex) {
    const [moved] = array.splice(fromIndex, 1);
    array.splice(toIndex, 0, moved);
  }

  // Native HTML5 drag-and-drop (used for the ⋮⋮ handles) has no touch
  // equivalent on phones, so these buttons give touch and keyboard users
  // a working way to reorder categories/items too.
  function createReorderButtons(array, index, symbols, ariaLabelPrefix, onReordered) {
    const wrap = document.createElement("span");
    wrap.className = "reorder-buttons";

    const prevBtn = document.createElement("button");
    prevBtn.type = "button";
    prevBtn.className = "icon-btn reorder-btn";
    prevBtn.textContent = symbols[0];
    prevBtn.disabled = spinning || index === 0;
    prevBtn.setAttribute("aria-label", `${ariaLabelPrefix} 앞으로 이동`);
    prevBtn.addEventListener("click", () => {
      playClick();
      reorder(array, index, index - 1);
      onReordered();
    });
    wrap.appendChild(prevBtn);

    const nextBtn = document.createElement("button");
    nextBtn.type = "button";
    nextBtn.className = "icon-btn reorder-btn";
    nextBtn.textContent = symbols[1];
    nextBtn.disabled = spinning || index === array.length - 1;
    nextBtn.setAttribute("aria-label", `${ariaLabelPrefix} 뒤로 이동`);
    nextBtn.addEventListener("click", () => {
      playClick();
      reorder(array, index, index + 1);
      onReordered();
    });
    wrap.appendChild(nextBtn);

    return wrap;
  }

  // Counts are relative to "now", so they shrink on their own as wins age
  // past the 7-day / 28-day marks.
  function formatWinStats(item) {
    const now = Date.now();
    const week = item.wins.filter((t) => now - t <= WEEK_MS).length;
    const fourWeeks = item.wins.filter((t) => now - t <= FOUR_WEEKS_MS).length;
    return `최근 일주일/한달 내 당첨 횟수 : ${week}회/${fourWeeks}회`;
  }

  // True while a re-render would disrupt the user: it would either change
  // the wheel mid-spin or destroy the inline editor they're typing into.
  // Background refreshes (win-count recalculation, sheet pulls) wait it out.
  function isBusy() {
    return (
      spinning ||
      addingCategory ||
      editingHeaderField !== null ||
      editingCategoryId !== null ||
      editingItemId !== null
    );
  }

  function renderWheelRoster() {
    wheelRoster.replaceChildren();

    const people = [];

  // Everything that depends on who is on the wheel, without rebuilding the
  // category board (which would drop focus from the control just used).
  function refreshWheel() {

    renderWheelRoster();

  }

  function createCountStepper(item) {
    const wrap = document.createElement("span");
    wrap.className = "count-stepper";
    wrap.classList.toggle("muted", !item.included);
    wrap.title = "룰렛에 넣을 횟수";

    const minus = document.createElement("button");
    minus.type = "button";
    minus.className = "count-btn";
    minus.textContent = "−";
    minus.setAttribute("aria-label", `${item.name} 룰렛에서 한 번 빼기`);

    const value = document.createElement("span");
    value.className = "count-value";

    const plus = document.createElement("button");
    plus.type = "button";
    plus.className = "count-btn";
    plus.textContent = "+";
    plus.setAttribute("aria-label", `${item.name} 룰렛에 한 번 더 넣기`);

    function show() {
      value.textContent = `×${item.count}`;
      wrap.classList.toggle("multiple", item.count > 1);
      minus.disabled = spinning || item.count <= 1;
      plus.disabled = spinning || item.count >= MAX_ENTRIES_PER_ITEM;
    }

    function change(delta) {
      const next = clampEntryCount(item.count + delta);
      if (next === item.count) return;
      playClick();
      item.count = next;
      show();
      refreshWheel();
      saveState();
    }

    minus.addEventListener("click", () => change(-1));
    plus.addEventListener("click", () => change(1));

    wrap.append(minus, value, plus);
    show();
    return wrap;
  }

  // ---------- Editable heading ----------
  function renderEditableHeading(container, value, field, maxLength, apply) {
    container.innerHTML = "";

    if (editingHeaderField === field) {
      const input = document.createElement("input");
      input.type = "text";
      input.className = "edit-input";
      input.value = value;
      input.maxLength = maxLength;
      container.appendChild(input);

      // An inline editor commits on both Enter and blur, and committing
      // re-renders (which removes the focused input and fires blur again),
      // so every commit path is guarded against running twice.
      let done = false;
      const commit = () => {
        if (done) return;
        done = true;
        const next = input.value.trim();
        if (next) apply(next);
        editingHeaderField = null;
        renderAll();
      };
      input.addEventListener("keydown", (e) => {
        if (e.key === "Enter") commit();
        if (e.key === "Escape") {
          done = true;
          editingHeaderField = null;
          renderHeader();
        }
      });
      input.addEventListener("blur", commit);
      requestAnimationFrame(() => {
        input.focus();
        input.select();
      });
      return;
    }

    const span = document.createElement("span");
    span.textContent = value;
    container.appendChild(span);

    const editBtn = document.createElement("button");
    editBtn.type = "button";
    editBtn.className = "icon-btn";
    editBtn.textContent = "✎";
    editBtn.disabled = spinning;
    editBtn.setAttribute("aria-label", `${field === "title" ? "제목" : "부제목"} 수정`);
    editBtn.addEventListener("click", () => {

  // ---------- Wheel drawing ----------
  // Sizes are written for a 360px wheel and scaled by `s`.
  function paintHub(g, center, radius, s) {
    g.beginPath();
    g.arc(center, center, radius, 0, Math.PI * 2);
    g.fillStyle = "#fffaf3";
    g.fill();
    g.lineWidth = 2 * s;
    g.strokeStyle = "rgba(0, 0, 0, 0.12)";
    g.stroke();

    g.beginPath();
    g.arc(center, center, radius * 0.45, 0, Math.PI * 2);
    g.fillStyle = "#c9a8f5";
    g.fill();
  }

  function paintWheel(g, size, entries) {
    const s = size / 360;
    const center = size / 2;
    const faceRadius = center - 6 * s;
    const hubRadius = Math.max(24 * s, faceRadius * 0.17);

    g.clearRect(0, 0, size, size);

    // White backing ring so pastel slice edges stay crisp against the rim.
    g.beginPath();
    g.arc(center, center, center - 1 * s, 0, Math.PI * 2);
    g.fillStyle = "#ffffff";
    g.fill();

    if (entries.length === 0) {
      g.beginPath();
      g.arc(center, center, faceRadius, 0, Math.PI * 2);
      g.fillStyle = "#eae7f2";
      g.fill();
      paintHub(g, center, hubRadius, s);
      return;
    }

    const sliceAngle = (Math.PI * 2) / entries.length;
    const fontSize = Math.max(10, Math.min(16, Math.round(140 / entries.length) + 9)) * s;

    entries.forEach((entry, i) => {
      const start = i * sliceAngle;
      const end = start + sliceAngle;

      g.beginPath();
      g.moveTo(center, center);
      g.arc(center, center, faceRadius, start, end);
      g.closePath();
      g.fillStyle = SLICE_COLORS[i % SLICE_COLORS.length];
      g.fill();

      g.beginPath();
      g.moveTo(center, center);
      g.lineTo(center + Math.cos(start) * faceRadius, center + Math.sin(start) * faceRadius);
      g.strokeStyle = "#ffffff";
      g.lineWidth = 2 * s;
      g.stroke();

      g.save();
      g.translate(center, center);
      g.rotate(start + sliceAngle / 2);
      g.textAlign = "right";
      g.textBaseline = "middle";
      g.font = `bold ${fontSize}px system-ui, sans-serif`;
      g.lineWidth = 3 * s;
      g.strokeStyle = "rgba(255, 255, 255, 0.9)";
      g.strokeText(entry.item.name, faceRadius - 18 * s, 0);
      g.fillStyle = "#3a2f45";
      g.fillText(entry.item.name, faceRadius - 18 * s, 0);
      g.restore();
    });

    // Frets between pockets.
    entries.forEach((_, i) => {
      const angle = i * sliceAngle;
      const px = center + Math.cos(angle) * (faceRadius - 3 * s);
      const py = center + Math.sin(angle) * (faceRadius - 3 * s);
      g.beginPath();
      g.arc(px, py, 3.5 * s, 0, Math.PI * 2);
      g.fillStyle = "#ffffff";
      g.lineWidth = 1 * s;
      g.strokeStyle = "rgba(0, 0, 0, 0.15)";
      g.fill();
      g.stroke();
    });

    // Inner ring around the hub.
    g.beginPath();
    g.arc(center, center, hubRadius + 6 * s, 0, Math.PI * 2);
    g.strokeStyle = "rgba(255, 84, 112, 0.8)";
    g.lineWidth = 3 * s;
    g.stroke();

    paintHub(g, center, hubRadius, s);
  }

  function drawWheel() {
    paintWheel(ctx, canvas.width, getWheelEntries());
  }

  // ---------- Category board ----------
